openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Cloud providers API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- name: Cloud Providers
paths:
  /organizations/{organization_canonical}/cloud_providers:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Get the list of Cloud Providers
      tags:
      - Cloud Providers
      operationId: getCloudProviders
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: List of Cloud Providers
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudProvider'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - abbreviation: AWS
                  canonical: aws
                  id: 1
                  name: Amazon Web Services
                  regions:
                  - af-south-1
                  - eu-west-2
                  - us-east-1
                  - us-east-2
                - abbreviation: GCP
                  canonical: google
                  id: 2
                  name: Google Cloud Platform
                - abbreviation: Azure
                  canonical: azurerm
                  id: 3
                  name: Azure
                  regions:
                  - asia
                  - asiapacific
                  - australia
                  - australiacentral
                - abbreviation: FlexibleEngine
                  canonical: flexibleengine
                  id: 4
                  name: Flexible Engine
                - abbreviation: OpenStack
                  canonical: openstack
                  id: 5
                  name: OpenStack
                - abbreviation: Scaleway
                  canonical: scaleway
                  id: 6
                  name: Scaleway
                - abbreviation: VMware
                  canonical: vmware
                  id: 7
                  name: VMware
                - abbreviation: OVH
                  canonical: ovh
                  id: 8
                  name: OVH Cloud
                - abbreviation: Alibaba
                  canonical: alibaba
                  id: 9
                  name: Alibaba Cloud
                - abbreviation: OCI
                  canonical: oracle
                  id: 10
                  name: Oracle Cloud Infrastructure
                pagination:
                  index: 1
                  size: 10
                  total: 2
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get cloud providers
      x-summary-source: derived
components:
  parameters:
    page_size:
      description: The number of items at most which the response can have.
      name: page_size
      in: query
      schema:
        type: integer
        format: uint32
        default: 100
    organization_canonical:
      description: A canonical of an organization.
      name: organization_canonical
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 2
        pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    page_index:
      description: The page number to request. The first page is 1.
      name: page_index
      in: query
      schema:
        type: integer
        format: uint32
        default: 1
  schemas:
    Pagination:
      type: object
      title: Pagination
      required:
      - total
      - index
      - size
      properties:
        index:
          description: The index of the page sent (the first page is 1).
          type: integer
          format: uint64
          minimum: 1
        size:
          description: The size of the page (the number of entities per page)
          type: integer
          format: uint64
        total:
          description: The total number of items.
          type: integer
          format: uint64
    ErrorDetailsItem:
      description: Represents an item of the list of details of an error.
      title: Error details item
      required:
      - message
      - code
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: string
        message:
          type: string
    CloudProvider:
      description: CloudProvider represents a cloud provider. Those cloud providers are used to identify the scope of projects and/or stacks.
      title: Cloud Provider
      required:
      - canonical
      - name
      properties:
        abbreviation:
          type: string
          maxLength: 60
          minLength: 2
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
          enum:
          - aws
          - google
          - azurerm
          - flexibleengine
          - openstack
          - scaleway
          - vmware
          - ovh
          - alibaba
          - oracle
          - vsphere
          - kubernetes
        created_at:
          type: integer
          format: uint64
        id:
          type: integer
          format: uint32
          minimum: 1
        name:
          type: string
          maxLength: 60
          minLength: 2
        regions:
          type: array
          items:
            type: string
        updated_at:
          type: integer
          format: uint64
    ErrorPayload:
      description: 'The payload used by the server to response to the client with an Error, those errors could be any of the ones listed [here](https://github.com/cycloidio/youdeploy-http-api/blob/develop/errors/code.go#L10), only the CODE of the error is the one that is guaranteed to not change between the same major version, the MESSAGE could change.

        '
      title: Error Payload
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetailsItem'
        request_id:
          type: string
  responses:
    unexpected_error:
      description: The response sent when an unexpected error happened, as known as an internal server error.
      headers:
        Content-Length:
          description: The length of the response body in octets (8-bit bytes).
          schema:
            type: integer
            format: uint64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
          example:
            errors:
            - code: Unexpected
              message: Server Internal error
  securitySchemes:
    api_key:
      description: The API authorization is done with JWT tokens
      type: apiKey
      name: Authorization
      in: header
    api_key_query:
      description: The API authorization is done with JWT tokens in the query string
      type: apiKey
      name: api_key
      in: query
x-provenance:
  method: harvested
  publisher: Cycloid
  source: https://http-api.cycloid.io/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
