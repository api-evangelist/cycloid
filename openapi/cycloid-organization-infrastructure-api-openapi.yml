openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Organization Infrastructure API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- description: Operations on the infrastructure of an organization
  name: Organization Infrastructure
paths:
  /organizations/{organization_canonical}/infrastructures/aws:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Get the number of resources classified by types, of the running AWS infrastructure of the organization and associated AWS account (credential). The parameters allow to select the scope of the request to one project of the organization and/or a set of type of resource.
      tags:
      - Organization Infrastructure
      operationId: getRunningInfraAWS
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/credential_canonical_query'
      - $ref: '#/components/parameters/project_canonical_query'
      - $ref: '#/components/parameters/aws_infrastructure_resource_query'
      - $ref: '#/components/parameters/aws_tags'
      responses:
        '200':
          description: The number of resources classified per type which matches the scope specified by the filter.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AWSInfrastructureResourcesAggregation'
              example:
                data:
                  buckets:
                    total_amount: 10
                  db_instances:
                    total_amount: 34
                  images:
                    total_amount: 6
                  instances:
                    total_amount: 94875
                  load_balancers_v2:
                    total_amount: 4
                  security_groups:
                    total_amount: 9
                  snapshots:
                    total_amount: 786
                  subnets:
                    total_amount: 31
                  volumes:
                    total_amount: 45
                  vpcs:
                    total_amount: 98
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get running infra AWS
      x-summary-source: derived
  /organizations/{organization_canonical}/infrastructures/aws/buckets:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Get the list of S3 buckets of the running AWS infrastructure and associated with the AWS account (credential). The parameters allow to select the scope of the request to one project of the organization.
