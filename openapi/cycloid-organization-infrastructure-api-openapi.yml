      - Organization Infrastructure
      operationId: getRunningInfraAWSBuckets
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/credential_canonical_query'
      - $ref: '#/components/parameters/project_canonical_query'
      - $ref: '#/components/parameters/aws_tags'
      responses:
        '200':
          description: The list of AWS S3 buckets which matches the scope specified by the filter.
          content:
            application/json:
              schema:
                description: Although this response contains a collection of items, it doesn't have pagination because the AWS SDK, to request the S3 Buckets resources, doesn't provide any pagination mechanism.
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AWSInfrastructureResourceBucket'
              example:
                data:
                - CreationDate: '2017-03-29T05:15:27Z'
                  Name: config-bucket-123456789101
                  Tags: null
                - CreationDate: '2017-03-29T01:12:21Z'
                  Name: data-some-log-dbm
                  Tags:
                  - Key: client
                    Value: Cycloid
                - CreationDate: '2017-03-29T10:28:14Z'
                  Name: dev-sdk.web.fr
                  Tags: null
                - CreationDate: '2017-06-19T14:57:15Z'
                  Name: marianorajoy.es
                  Tags:
                  - Key: owner
                    Value: Mariano Rajoy
                - CreationDate: '2017-03-29T18:01:25Z'
                  Name: dtrump.com
                  Tags: null
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get running infra AWS buckets
      x-summary-source: derived
