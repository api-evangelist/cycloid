        service_catalog_source_canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        team:
          description: Team that maintains the stack
          $ref: '#/components/schemas/SimpleTeam'
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogTechnology'
        trusted:
          description: If 'true' the ServiceCatalog is from the main organization and can be trusted.
          type: boolean
        unique:
          description: Determines if the stack can be instantiated only once per organization, project and environment
          type: boolean
        updated_at:
          type: integer
          format: uint64
        version:
          description: Version of the stack
          type: string
        visibility:
          type: string
