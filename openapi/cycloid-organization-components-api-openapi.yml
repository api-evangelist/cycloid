components:
  schemas:
    UpdateComponent:
      description: The entity which represents the information of a component to update.
      type: object
      title: Update Component
      required:
      - name
      properties:
        description:
          type: string
        name:
          type: string
          minLength: 1
    FormsValuesRefTLS:
      description: TLS verification for a values_ref HTTPS call, for remotes whose certificate the platform cannot verify out of the box.
      type: object
      title: Forms values ref TLS
      properties:
        ca_cert:
          description: PEM certificate of a CA to trust in addition to the system roots, either the PEM itself or a ${cred:canonical.field} reference resolved server-side. Cannot be combined with insecure_skip_verify.
          type: string
        insecure_skip_verify:
          description: Accept any certificate the remote presents. Leaves the call open to interception, so ca_cert is always preferred.
          type: boolean
        server_name:
          description: Name verified against the certificate and sent as SNI, for remotes addressed by IP or by a name their certificate does not carry.
          type: string
    InfrastructureGraphEdge:
      description: Holds the information of an Edge of the Graph
      type: object
      title: Infrastructure
      required:
      - id
      - source
      - target
      - canonicals
      properties:
        canonicals:
          type: array
          items:
            type: string
        id:
          type: string
        source:
          type: string
        target:
          type: string
    ConfigRepositorySyncStatus:
      description: Derived health of a config repository's asynchronous git projection, computed from the pending commit-outbox entries. Surfaced so the UI can tell the user their saved configuration is failing to sync (and is being retried automatically) without implying the configuration was lost.
      type: object
      title: ConfigRepositorySyncStatus
      required:
      - state
      properties:
        last_error:
          description: The most recent sync failure message (present when state is error).
          type: string
        oldest_pending_at:
          description: Unix timestamp in milliseconds of the oldest change still pending projection to git.
          type: integer
          format: uint64
        pending_count:
          description: Number of buffered changes not yet mirrored to git.
          type: integer
          format: uint64
        state:
          description: 'synced: nothing pending, git mirror up to date. syncing: pending entries, no recorded error (normal catch-up). error: pending entries are failing to sync and are being retried.'
          type: string
          enum:
          - synced
          - syncing
          - error
    PluginInstall:
      description: The Plugin Install data
      type: object
      title: Plugin Install
      required:
      - id
      - uuid
      - configuration
      - status
      - pm_secret
      - created_at
      - updated_at
      properties:
        configuration:
          description: Stack Forms syntax configuration
          type: object
          additionalProperties:
            type: string
        created_at:
          type: integer
          format: uint64
        id:
          type: integer
          format: uint32
          minimum: 1
        inherited:
          description: Whether the install is inherited from a parent organization
          type: boolean
        owner_organization_canonical:
          description: Canonical of the organization that owns the plugin install
          type: string
        pm_secret:
          description: Secret used by the frontend to generate webhooks for the Plugin
          type: string
        read_only:
          description: Whether the install is read-only (inherited from parent org)
          type: boolean
        setup:
          description: Per-install runtime setup overrides
          type:
          - object
          - 'null'
          properties:
            max_cpu:
              description: K8s resource limit for CPU
              type: string
            max_memory:
              description: K8s resource limit for memory
              type: string
            max_replicas:
              description: HPA maximum replicas (mutually exclusive with replicas)
              type: integer
              format: int32
            min_cpu:
              description: K8s resource request for CPU
              type: string
            min_memory:
              description: K8s resource request for memory
              type: string
            min_replicas:
              description: HPA minimum replicas (mutually exclusive with replicas)
              type: integer
              format: int32
            replicas:
              description: Static replica count (mutually exclusive with min/max_replicas)
              type: integer
              format: int32
        status:
          description: Status of the Plugin deployment process on Plugin Manager
          type: string
          enum:
          - pending
          - running
          - failed
        updated_at:
          type: integer
          format: uint64
        url_slug:
          description: URL-friendly slug for the plugin install, unique per organization
          type: string
        uuid:
          description: Unique identifier of the Plugin Install
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/PluginVersion'
        visibility:
          description: Visibility scope of the plugin install
          type: string
          enum:
          - local
          - shared
    PluginVersion:
      description: The Plugin that holds all the Versions
      type: object
      title: Plugin
      required:
      - id
      - name
      - url
      - status
      properties:
        configuration:
          description: Stack Forms syntax configuration
          type: array
          items:
            type: object
        description:
          description: The Description of the Plugin Version
          type: string
        error:
          description: If an error happen on the creation of the Version this will hold the info
          type: string
        icon:
          description: Icon of the Plugin Version
          type: string
          format: uri
        id:
          type: integer
          format: uint32
          minimum: 1
        images:
          description: Images to show the Plugin Version
          type: array
          items:
            type: string
            format: uri
        name:
          description: Name assigned to the Plugin
          type: string
        schema:
          description: Schema of the SQLite schema
          type: object
        scope:
          description: Policies in which the Plugin Version is scoped
          type: array
          items:
            type: string
        setup:
          description: Runtime setup declared in the plugin manifest
          type: object
          properties:
            max_cpu:
              description: K8s resource limit for CPU
              type: string
            max_memory:
              description: K8s resource limit for memory
              type: string
            min_cpu:
              description: K8s resource request for CPU
              type: string
            min_memory:
              description: K8s resource request for memory
              type: string
            readiness_path:
              description: HTTP path for K8s readiness probe
              type: string
        status:
          description: Status of the current Plugin Version creation process
          type: string
          enum:
          - pending
          - processing
          - failed
          - success
        url:
