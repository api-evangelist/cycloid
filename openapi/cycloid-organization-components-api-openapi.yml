openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Organization components API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- description: Operations on the components of an organization
  name: Organization components
paths:
  /organizations/{organization_canonical}/components:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Fetch the components within the organization. Components can also be filtered by canonical, name, or `component_search` (matches either) using LHS query filters, e.g. `?component_search[rlike]=my-component`.
      tags:
      - Organization components
      operationId: getOrganizationComponents
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/component_canonical_query'
      - $ref: '#/components/parameters/component_name_query'
      - $ref: '#/components/parameters/component_search_query'
      responses:
        '200':
          description: List of the Components
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Component'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - canonical: component-1
                  created_at: 1503225026
                  id: 1
                  name: Component 1
                  updated_at: 1503335026
                  use_case: default
                - canonical: component-2
                  created_at: 1503225026
                  id: 2
                  name: Component 2
                  updated_at: 1503335026
                  use_case: default
                pagination:
                  index: 1
                  size: 10
                  total: 2
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get organization components
      x-summary-source: derived
  /organizations/{organization_canonical}/projects/{project_canonical}/environments/{environment_canonical}/components:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    - $ref: '#/components/parameters/environment_canonical'
    get:
      description: Fetch the components that are part of the environment. Components can also be filtered by canonical, name, or `component_search` (matches either) using LHS query filters, e.g. `?component_search[rlike]=my-component`.
      tags:
      - Organization components
      operationId: getComponents
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/component_canonical_query'
      - $ref: '#/components/parameters/component_name_query'
      - $ref: '#/components/parameters/component_search_query'
      responses:
        '200':
          description: List of the Components
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Component'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - canonical: component-1
                  created_at: 1503225026
                  id: 1
                  name: Component 1
                  updated_at: 1503335026
                  use_case: default
                - canonical: component-2
                  created_at: 1503225026
                  id: 2
                  name: Component 2
                  updated_at: 1503335026
                  use_case: default
                pagination:
                  index: 1
                  size: 10
                  total: 2
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get components
      x-summary-source: derived
    put:
      description: Create and configure a new Component in one step
      tags:
      - Organization components
      operationId: createAndConfigureComponent
      responses:
        '200':
          description: Component created and configured. The body contains the information of the new created Component.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
              example:
                data:
                  canonical: name-key
                  created_at: 1503225026
                  id: 3
                  name: name-key
                  updated_at: 1503335026
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewAndConfiguredComponent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewAndConfiguredComponent'
        description: The information of the component to create and configure.
        required: true
      summary: Create and configure component
      x-summary-source: derived
    post:
      description: Create a new Component
      tags:
      - Organization components
      operationId: createComponent
      responses:
        '200':
          description: Component created. The body contains the information of the new created Component.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
              example:
                data:
                  canonical: name-key
                  created_at: 1503225026
                  id: 2
                  name: name-key
                  updated_at: 1503335026
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewComponent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewComponent'
        description: The information of the component to create.
        required: true
      summary: Create component
      x-summary-source: derived
  ? /organizations/{organization_canonical}/projects/{project_canonical}/environments/{environment_canonical}/components/{component_canonical}
  : parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    - $ref: '#/components/parameters/environment_canonical'
    - $ref: '#/components/parameters/component_canonical'
    get:
      description: Fetch the component that's part of the environment
      tags:
      - Organization components
      operationId: getComponent
      responses:
        '200':
          description: Component
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
              example:
                data:
                  canonical: component-1
                  created_at: 1503225026
                  id: 1
                  name: Component 1
                  updated_at: 1503335026
                  use_case: default
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get component
      x-summary-source: derived
    put:
      description: Update the component that's part of the environment
      tags:
      - Organization components
      operationId: updateComponent
      responses:
        '200':
          description: Component
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Component'
              example:
                data:
                  canonical: component-1
                  created_at: 1503225026
                  id: 1
                  name: Component 1
                  updated_at: 1503335026
                  use_case: default
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateComponent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateComponent'
        description: Component object that needs to be updated
        required: true
      summary: Update component
      x-summary-source: derived
    delete:
      description: Delete a component of the environment.
      tags:
      - Organization components
      operationId: deleteComponent
      parameters:
      - $ref: '#/components/parameters/ignore_config_files_err'
      - $ref: '#/components/parameters/skip_hooks'
      responses:
        '200':
          description: 'This status code is returned when the component has on_delete hooks defined.

            The hooks have been triggered but the component still exists.

            Use skip_hooks=true to delete the component skipping the hooks.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Build'
        '204':
          description: Component has been deleted.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete component
      x-summary-source: derived
  ? /organizations/{organization_canonical}/projects/{project_canonical}/environments/{environment_canonical}/components/{component_canonical}/config
  : parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    - $ref: '#/components/parameters/environment_canonical'
    - $ref: '#/components/parameters/component_canonical'
    get:
      description: Fetch the current component configuration variables.
      tags:
      - Organization components
      operationId: getComponentConfig
      parameters:
      - $ref: '#/components/parameters/service_catalog_source_version_id'
      responses:
        '200':
          description: Config that's used by the component
          headers:
            Content-Length:
              description: The length of the response body in octets (8-bit bytes).
              schema:
                type: integer
                format: uint64
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    $ref: '#/components/schemas/FormVariables'
              example:
                data:
                  section1:
                    group1:
                      var1: value
                      var2: value
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get component config
      x-summary-source: derived
