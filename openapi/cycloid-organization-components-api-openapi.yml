      - placement
      - widget
      - is_default
      properties:
        id:
          type: integer
          format: uint32
          minimum: 1
        is_default:
          description: Whether this is a default widget
          type: boolean
        placement:
          description: 'Placement configuration of the widget. When type is "component", requires "tab_name" in config. When type is "sideMenuPage", requires "title" and "description" in config.

            '
          type: object
        relation:
          $ref: '#/components/schemas/PluginRelation'
        type:
          description: Type of the widget
          type: string
          enum:
          - table
          - iframe
        url_slug:
          description: URL-friendly slug derived from the widget title
          type: string
        widget:
          description: Widget configuration
          type: object
        widget_key:
          description: 'Stable key declared for the widget in the plugin''s widgets.yaml, used to match it across plugin version upgrades. Empty when the widget declares none.

            '
          type: string
    FormsValuesRefConfig:
      description: 'Optional configuration for a values_ref HTTP call: the request method and body, authentication, extra request headers, a timeout and TLS verification.'
      type: object
      title: Forms values ref config
      properties:
        auth:
          $ref: '#/components/schemas/FormsValuesRefAuth'
        body:
          description: Request payload, sent as application/json. An object or array is serialized to JSON; a string is sent verbatim, so a payload written as raw JSON keeps its shape. Every string it holds may embed a ${cred:canonical.field} reference resolved server-side.
        headers:
          description: Additional request headers. Values may be static or a ${cred:canonical.field} reference resolved server-side.
          type: object
          additionalProperties:
            type: string
        method:
          description: HTTP method of the request. Defaults to GET, the only method that cannot carry a body.
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        timeout:
          description: Request timeout as a Go duration string (e.g. "30s", "1m"). Defaults to 10s, capped at 60s.
          type: string
        tls:
          $ref: '#/components/schemas/FormsValuesRefTLS'
    FormGroup:
