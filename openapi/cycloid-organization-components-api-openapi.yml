    FormEntity:
      description: This describes all the attributes possible to configure a form's variable
      type: object
      title: Forms file's Entity
      required:
      - name
      - widget
      properties:
        condition:
          description: Optional condition expression that gates whether this widget is displayed. Same V2 syntax as Group.condition (e.g. "$other_field == 'aws'"). Variables prefixed with "ctx_" are runtime-injected and bypass the entity-existence validation.
          type: string
        current:
          description: The current value that was previously configured for this variable upon creation or update. In case of shared variables having different values, it will be empty, and 'mismatch_values' will be filled instead.
          type: object
        current_invalid:
          description: True when 'current' is non-empty but could not be resolved to any of the widget's available options, e.g. the option was removed from the form. 'current' still holds the raw stored value in this case. Never true for an empty 'current' -- that's an unfilled optional field, not a removed option.
          type: boolean
        default:
          description: "Default can take 2 kinds of definition.\nThe first one is simply the variable to assign if nothing is given by the user and that the variable is required.\nThe second one is dynamic default, meaning default that can vary based on conditions. The format is as follows:\n  options:\n    - name: \"Name of set (can be omitted)\"\n      condition: \"$env == 'dev'\"\n      default: t2.micro\n    - condition: \"$env == 'prod'\"\n      default: t2.large"
          type: object
        depends_on:
          description: List of keys that are required to use this entity
          type: array
          items:
            type: string
        description:
          description: The description helping users understand the interest/impact of such variable/change
          type: string
        folded:
          description: Whether or not the entity should be displayed to the user. This entity must be usable as such (not required, or with a default if required)
          type: boolean
        hidden:
          description: 'Whether or not the entity should be hidden from the user. When true the widget is not displayed regardless of its widget type. This is an independent attribute; set it on any widget type. The legacy widget: hidden form is still supported for backward compatibility.'
          type: boolean
        items:
          description: Sub-entity definitions for the repeatable widget. Each item defines a field that users can fill N times. Only valid when widget is 'repeatable'.
          type: array
          items:
            $ref: '#/components/schemas/FormEntity'
        key:
          description: 'The key is the name of variables for the ansible/pipeline/terraform technologies. If this is a first level variable then: keyX. If you have multiple terraform modules then use: module.Y.keyX to help identify the unique variable. Required for every widget except ''info'': an info block carries no value, so it needs no addressing key, and any key given is ignored.'
          type: string
        mismatch_values:
          description: This is filled only when a shared variable does not have the same values anymore. e.g. a variable 'foo' was shared between 'ansible' and 'pipeline', was set to 'bar', but now the value found for 'ansible' is 'bus', while it's still 'bar' for the pipeline. In such situation, the Forms don't know anymore which is the correct data and will return both, while unsetting the 'Current' field.
          type: array
          items:
            type: object
        name:
          description: The name of the variable displayed to the user
          type: string
        read_only:
          description: Whether or not the entity is displayed to the user but cannot be modified. Useful for showing computed or immutable values.
          type: boolean
        read_only_on_update:
          description: Whether or not the entity can be set at creation but is locked on every subsequent update. Once a value has been stored it cannot be modified anymore.
          type: boolean
        required:
          description: Whether or not the field is required - that helps distinguish "optional" variables and allows to set default if necessary and present
          type: boolean
        resolve_values:
          description: Enables ${variable_name} interpolation inside the values and default fields. When true, ${key} tokens matching sibling entity keys in the same use_case are resolved at render time using the referenced field's current value. Supports concatenation and escape syntax ($${key} produces literal ${key}).
          type: boolean
        source:
          description: 'The source is only used for the branch widget to reference the key of the SCS or CR that the branches have to be read from. Because a branch in itself cannot exist, the user has to indicate from which SCS or CR he wants to retrieve branches. The source has to reference the key of an entity of a widget: ''CyCRS'' or ''CySCS'''
          type: string
        transform:
          description: Ordered pipeline of steps applied to the resolved values (from static values, values_ref or dynamic options) before they are validated, mapped and rendered. Steps apply in the declared order.
          type: array
          items:
            $ref: '#/components/schemas/FormsTransformStep'
        type:
          description: The type of data handled - used to manipulate/validate the input, and also validate default/values. Required for every widget except 'info' - it carries no value, so its type is not applicable and ignored if set.
          type: string
          enum:
          - integer
          - float
          - string
          - array
          - boolean
          - map
        unit:
          description: 'The unit to be displayed for the variable, helping to know what''s being manipulated: amount of servers, Go, users, etc.'
          type: string
        validations:
          description: "An array of validations and relative errors for this entitiy. For example:\n  validations:\n    - regexp: \"^proj_.*$\"\n      error_message: \"the value must have 'proj_' as prefix\"\n    - regexp: \"^.*_awesome$\"\n      error_message: \"the value must have '_awesome' as suffix\"\nAt the moment only regexp validations are implemented but we can expect objects with a 'type', and 'error_message' field. The type field can hold the constraint, as in the case of regexp or hipotetically a moe complex object."
          type: array
          items:
            type: object
        values:
          description: "Values can take 2 kinds of definition.\nFirst one is a list of object, such as list of integer, maps, etc. Values allowed, e.g. [1, 10, 20, 50]. Note: In case of SliderRange only 2 values should be provided: [min, max], in case of providing them the other way around some validation test will fail.\nSecond one is dynamic values, meaning values that can vary based on conditions. The format is as follows:\n  options:\n    - name: \"Name of set (can be omitted)\"\n      condition: \"$env == 'dev'\"\n      values: [dev-ami1, dev-ami2, dev-ami3]\n    - condition: \"$env == 'prod'\"\n      values: [prod-ami1, prod-ami2, prod-ami3]"
          type: object
        values_ref:
          description: It's a URL in which the values have to be fetched from
          type: string
        values_ref_config:
          $ref: '#/components/schemas/FormsValuesRefConfig'
        widget:
          description: The widget used to display the data in the most suitable way
          type: string
          enum:
          - auto_complete
          - dropdown
          - radios
          - slider_list
          - slider_range
          - number
          - simple_text
          - switch
          - text_area
          - cy_cred
          - cy_scs
          - cy_crs
          - cy_branch
          - cy_inventory_resource
          - cy_inventory_output
          - date_time
          - hidden
          - repeatable
          - info
        widget_config:
          description: "Some specific configuration that could be applied to that widget. Currently only a few widgets can be configured:\n  * cy_cred\n    * 'cred_types' (list): reduce the types of credentials retrieved to that list. See supported types of credentials\n    * 'display_keys' (bool): to specify if the path + key have to be written or only the path\n    * 'format' (enum): credential format, one of: 'path' | 'uri'. Defaults to path. Only credentials in URI format can be shared between technologies.\n    * 'uri_parameters' (map): optional query parameters that should be encoded and added to the resulting credential URI by the client. For example, they may be used to specify the output format (e.g., JSON). Applies only if format='uri'.\n    * 'cred_name' (string): pin the widget to a single credential canonical, so the end user only provides the secret value. The value is slugified by the API and must be consumed as returned. Mutually exclusive with 'cred_name_prefix'.\n    * 'cred_name_prefix' (string): pin the beginning of the credential canonical, the end user provides only the suffix. Slugified by the API, a trailing '-' or '_' separator is preserved. Mutually exclusive with 'cred_name'.\n    * 'cred_key' (string): the key inside the credential that holds the value, used when the credential is created inline.\n  * radio\n    * 'orientation' (string): whether you want to display it in an 'horizontal' or 'vertical' way\n  * cy_inventory_resource\n    * 'attribute' (string): REQUIRED The path to the attribute to actually use as value\n    * 'filters': (object): The filters to apply, selected from the list below:\n      * 'provider' (string): The provider like '\"provider[\\\"registry.terraform.io/hashicorp/aws\\\"]\"'\n      * 'type'  (string): The type of the resource like 'aws_vpc'\n      * 'name' (string): The name of the resource like 'front'\n      * 'module' (string): The module name like 'module.lemp'\n      * 'label' (string): The label of the resource, this only applies for resources created directly from the API/FE\n      * 'attributes' (string): The query string to filter the attributes like 'ingress[0].protocol[eq]=tcp'\n      * 'custom_attributes' (string): The query string to filter the custom_attributes like 'ingress[0].protocol[eq]=tcp'\n      * 'project' (string): Linked project canonical\n      * 'environment' (string): Linked environment canonical\n      * 'component' (string): Linked component canonical\n  * date_time\n    * 'format' (string): the date/time format string for storage, display and typing, using date-fns tokens (e.g. \"yyyy-MM-dd\", \"yyyy-MM-dd HH:mm\", \"yyyy-MM-dd'T'HH:mm:ss'Z'\"). Defaults to \"yyyy-MM-dd'T'HH:mm:ss'Z'\" (RFC 3339 UTC) if not specified. A value with a time of day is stored in UTC whatever the format; the user picks, types and sees local time. Formats without an hour token and date_only values are stored as picked; formats with an offset token (X, x, O, z) store the local time with its offset.\n    * 'block_weekends' (bool): prevents selection of Saturday and Sunday dates (local calendar day). Defaults to false.\n    * 'date_only' (bool): restricts picker to date selection only (no time inputs). When true, format defaults to \"yyyy-MM-dd\". Defaults to false.\n    * 'min_future_distance' (string): minimum selectable future offset from today (e.g. '1d'). A future window also rules out every past day.\n    * 'max_future_distance' (string): maximum selectable future offset from today (e.g. '30d'). A future window also rules out every past day.\n    * 'min_past_distance' (string): minimum selectable past offset from today (e.g. '0d'). A past window also rules out every future day.\n    * 'max_past_distance' (string): maximum selectable past offset from today (e.g. '90d'). A past window also rules out every future day.\n    * 'allowed_time_start' (string): earliest selectable time of day in UTC (local time for formats with an offset token), as HH:mm (e.g. '09:00'); shown to the user in local time. Also the default time of a freshly picked day.\n    * 'allowed_time_end' (string): latest selectable time of day in UTC (local time for formats with an offset token), as HH:mm (e.g. '18:00'); shown to the user in local time. A start later than the end is a window that wraps past midnight.\n    * 'block_past_dates' (bool): prevents selection of dates in the past.\n    * 'max_date' (string): latest selectable date as YYYY-MM-DD (e.g. '2030-01-01').\n  * cy_inventory_output\n    * 'attribute' (string): Path to the output's attribute, which value will be used\n    * 'filters': (object): The filters to apply, selected from the list below:\n      * 'attributes' (string): The query string to filter the attributes like 'ingress[0].protocol[eq]=tcp'\n      * 'keys' (list(string)): List of output keys to select from\n      * 'project' (string): Linked project canonical\n      * 'environment' (string): Linked environment canonical\n      * 'component' (string): Linked component canonical\n      * 'service_catalogs' (list(string)): Linked service catalog (stack) canonicals\n  * repeatable\n    * 'min_items' (int): minimum number of repeatable instances (0 = no minimum)\n    * 'max_items' (int): maximum number of repeatable instances (0 = no maximum)\n    * 'item_label' (string): label template for each instance\n  * simple_text\n    * 'sensitive' (bool): render the input masked, with a show/hide toggle, instead of plain text. Display only -- the value is stored and submitted exactly as any other value. See the widget documentation for the \"not a secrets store\" warning."
          type: object
    CloudProvider:
      description: CloudProvider represents a cloud provider. Those cloud providers are used to identify the scope of projects and/or stacks.
      title: Cloud Provider
      required:
      - canonical
      - name
      properties:
        abbreviation:
          type: string
          maxLength: 60
          minLength: 2
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
          enum:
          - aws
          - google
          - azurerm
          - flexibleengine
          - openstack
          - scaleway
          - vmware
          - ovh
          - alibaba
          - oracle
          - vsphere
          - kubernetes
        created_at:
          type: integer
          format: uint64
        id:
          type: integer
          format: uint32
          minimum: 1
        name:
          type: string
          maxLength: 60
