      properties:
        condition:
          description: Condition required to be respected to be able to configure that group.
          type: string
        description:
          description: An optional description to display for this group
          type: string
        folded:
          description: Whether or not the group should be displayed to the user. Variables within this group must be usable as such (not required, or with a default if required)
