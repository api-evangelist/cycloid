    - $ref: '#/components/parameters/project_canonical'
    - $ref: '#/components/parameters/environment_canonical'
    - $ref: '#/components/parameters/component_canonical'
    - $ref: '#/components/parameters/widget_id'
    - $ref: '#/components/parameters/api_key'
    - description: Sub-path to proxy to the plugin
      name: path
      in: query
      schema:
        type: string
    get:
      description: Proxy a GET request to the plugin for a widget iframe.
      tags:
      - Organization components
      operationId: getComponentPluginWidgetIframeProxy
      responses:
        '200':
          description: Proxied response from Plugin Manager
          content:
            application/json:
              schema:
                type: string
        '403':
