        ci_port:
          type: string
        ci_team_name:
          type: string
        ci_url:
          type: string
        created_at:
          type: integer
          format: uint64
        disable_cost_estimation:
          description: When true, the StackForms cost estimation panel is hidden on every organization of the platform. Set on the root organization and applied platform-wide, so it is only returned for the root organization.
          type:
          - boolean
          - 'null'
        disable_member_invitation_email:
          description: When true, adding a member to an organization sends no invitation email. Set on the root organization and applied platform-wide, so it is only returned for the root organization.
          type:
          - boolean
          - 'null'
        disable_signup:
          description: When true, signups are rejected everywhere on the platform (plain email/password, AWS Marketplace, and SSO/social auto-enrollment) unless the email is already invited — same gate as sso_invite_only. Set on the root organization and applied platform-wide, so it is only returned for the root organization.
          type:
          - boolean
          - 'null'
        has_children:
          type: boolean
        hide_stack_version_out_of_sync:
          description: When true, the component list and project list hide the indicator shown when a version's commit no longer matches its reference commit. Other version status indicators are unaffected.
          type: boolean
        id:
          type: integer
          format: uint32
          minimum: 1
        impersonation_emails:
          description: Emails of the users allowed to impersonate other users. Set on the root organization only; empty means nobody can impersonate. Only returned to callers allowed to update the organization, omitted for everyone else.
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: string
            maxLength: 255
            pattern: ^\S+@\S+\.\S+$
        is_root:
          description: Defines if this organization is the root one on the platform or not
          type: boolean
        is_using_dedicated_authentication:
          type: boolean
        mfa_enabled:
          type: boolean
        name:
          type: string
          minLength: 2
        parent_canonical:
          description: Canonical of the immediate parent organization. Omitted when this organization is root.
          type:
          - string
          - 'null'
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        parent_name:
          description: Display name of the immediate parent organization. Omitted when this organization is root.
          type:
          - string
          - 'null'
        sso_invite_only:
          description: When true, SSO users can only join the organization if they have been explicitly invited
          type:
          - boolean
          - 'null'
        stack_branch_exclude_patterns:
          description: Glob patterns (filepath.Match syntax). Versions matching any of these are hidden from non-team-member users.
          type:
          - array
          - 'null'
          maxItems: 50
          items:
            type: string
            maxLength: 200
        stack_branch_include_patterns:
          description: Glob patterns (filepath.Match syntax). When set, only versions whose name matches at least one pattern are shown to non-team-member users. Empty means show all.
          type:
          - array
          - 'null'
          maxItems: 50
          items:
            type: string
            maxLength: 200
        subscription:
          $ref: '#/components/schemas/Subscription'
        updated_at:
          type: integer
          format: uint64
    OrganizationMessages:
