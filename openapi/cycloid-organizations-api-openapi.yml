openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Organizations API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- description: Operations for organizations.
  name: Organizations
paths:
  /organizations:
    get:
      description: Get the organizations that the authenticated user has access.
      tags:
      - Organizations
      operationId: getOrgs
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      - description: Search by the organization's name
        name: organization_name
        in: query
        schema:
          type: string
      - description: Search by organization's creation date
        name: organization_created_at
        in: query
        schema:
          type: integer
          format: uint64
      - $ref: '#/components/parameters/order_by_query'
      responses:
        '200':
          description: List of the organizations which authenticated user has access.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - blocked: null
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org1
                  ci_port: 443
                  ci_team_name: asfdOPNljk
                  ci_url: https://scheduler.cycloid.io
                  created_at: 1503225026
                  has_children: true
                  id: 1
                  name: Organization 1
                  subscription:
                    expires_at: 1501131026
                    members_count: 10
                    plan:
                      canonical: free_trial
                      id: 5
                      name: Free Trial
                  updated_at: 1503335026
                - blocked: null
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org2
                  ci_port: 443
                  ci_team_name: asfdOPNljk
                  ci_url: https://scheduler.cycloid.io
                  created_at: 1501131026
                  has_children: false
                  id: 1
                  name: Organization 2
                  subscription:
                    expires_at: 1501131026
                    members_count: 10
                    plan:
                      canonical: free_trial
                      id: 5
                      name: Free Trial
                  updated_at: 1503333026
                - blocked: null
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org3
                  ci_port: 443
                  ci_team_name: asfdOPNljk
                  ci_url: https://scheduler.cycloid.io
                  created_at: 1500135021
                  has_children: false
                  id: 1
                  name: Organization 3
                  subscription:
                    expires_at: 1501131026
                    members_count: 10
                    plan:
                      canonical: free_trial
                      id: 5
                      name: Free Trial
                  updated_at: 1503332021
                pagination:
                  index: 1
                  size: 10
                  total: 3
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get orgs
      x-summary-source: derived
    post:
      description: Create a new organization, making the authenticated user the owner of it.
      tags:
      - Organizations
      operationId: createOrg
      responses:
        '200':
          description: Organization created. The body contains the information of the new created organization.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
              example:
                data:
                  blocked: null
                  can_children_create_appearance: false
                  can_create_appearance: true
                  canonical: org1
                  ci_port: 443
                  ci_team_name: asfdOPNljk
                  ci_url: https://scheduler.cycloid.io
                  created_at: 1503225026
                  has_children: false
                  id: 1
                  name: Organization 1
                  updated_at: 1503335026
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewOrganization'
        description: The information of the organization to create.
        required: true
      summary: Create org
      x-summary-source: derived
  /organizations/{organization_canonical}:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Get the information of the organization.
      tags:
      - Organizations
      operationId: getOrg
      responses:
        '200':
          description: The information of the organization which has the specified ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
              example:
                data:
                  blocked: null
                  can_children_create_appearance: false
                  can_create_appearance: true
                  canonical: org3
                  ci_team_name: asfdOPNljk
                  created_at: 1500135021
                  has_children: false
                  id: 1
                  name: Organization 3
                  subscription:
                    expires_at: 1501131026
                    members_count: 10
                    plan:
                      canonical: free_trial
                      id: 5
                      name: Free Trial
                  updated_at: 1503332021
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get org
      x-summary-source: derived
    put:
      description: Update the information of the organization.
      tags:
      - Organizations
      operationId: updateOrg
      responses:
        '200':
          description: Organization updated. The body contains information of the updated organization.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
              example:
                data:
                  blocked: null
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org2
                  ci_team_name: asfdOPNljk
                  created_at: 1501131026
                  id: 1
                  name: Organization 2
                  subscription:
                    expires_at: 1501131026
                    members_count: 10
                    plan:
                      canonical: free_trial
                      id: 5
                      name: Free Trial
                  updated_at: 1503333026
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
        description: The information of the organization to update.
        required: true
      summary: Update org
      x-summary-source: derived
    delete:
      description: Delete the organization.
      tags:
      - Organizations
      operationId: deleteOrg
      responses:
        '204':
          description: Organization has been deleted.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete org
      x-summary-source: derived
  /organizations/{organization_canonical}/ancestors:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Get all the ancestors between the Organization and the User with the shortest path.
      tags:
      - Organizations
      operationId: getAncestors
      responses:
        '200':
          description: Get all the ancestors between the Organization and the User with the shortest path. 0 index is the parent and n is the searched child
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - blocked: null
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org1
                  ci_team_name: asfdOPNljk
                  created_at: 1503225026
                  id: 1
                  name: Organization 1
                  updated_at: 1503335026
                - blocked:
                  - require_payment
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org2
                  ci_team_name: asfdOPNljk
                  created_at: 1501131026
                  id: 2
                  name: Organization 2
                  updated_at: 1503333026
                - blocked:
                  - require_payment
                  can_children_create_appearance: true
                  can_create_appearance: true
                  canonical: org3
                  ci_team_name: asfdOPNljk
                  created_at: 1500135021
                  id: 3
                  name: Organization 3
                  updated_at: 1503332021
                pagination:
                  index: 33
                  size: 10
                  total: 42
        '401':
          $ref: '#/components/responses/unauthenticated'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get ancestors
      x-summary-source: derived
  /organizations/{organization_canonical}/branches:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/credential_canonical_not_required_query'
    - $ref: '#/components/parameters/git_url_query'
    get:
      description: 'Return all the branches of repository. If the repository is empty then an

        empty list will be returned.'
      tags:
      - Organizations
      operationId: getRepoBranches
      responses:
        '200':
          description: List of the repository branches
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: string
              example:
                data:
                - stacks
                - stacks2
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get repo branches
      x-summary-source: derived
  /organizations/{organization_canonical}/can_do:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    post:
      description: Checks if the JWT can do the action
      tags:
      - Organizations
      operationId: canDo
      responses:
        '200':
          description: The information of the possibility to do the action
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CanDoOutput'
              example:
                data:
                  entity_canonicals:
                  - pepito
                  - grillo
                  ok: true
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/CanDoInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CanDoInput'
        description: The information of the authorization
        required: true
      summary: Can do
      x-summary-source: derived
  /organizations/{organization_canonical}/can_do_batch:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    post:
      description: Checks if the JWT can do multiple actions at once
      tags:
      - Organizations
      operationId: canDoBatch
      responses:
        '200':
          description: The results of the authorization checks
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CanDoBatchOutputItem'
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/CanDoBatchInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CanDoBatchInput'
        description: The list of authorization checks
        required: true
      summary: Can do batch
      x-summary-source: derived
  /organizations/{organization_canonical}/events:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: 'Retrieve the list of events which has been registered on the organization. The events to request can be filtered using Unix timestamps in milliseconds (begin and end timestamps range), the event type and severity; when more than one are applied then they are applied with a logical AND.

        - The Unix timestamps must always be specified, the rest of the filters

        are not mandatory.'
      tags:
      - Organizations
      operationId: getEvents
      parameters:
      - $ref: '#/components/parameters/timestamp_range_begin_query'
      - $ref: '#/components/parameters/timestamp_range_end_query'
      - $ref: '#/components/parameters/event_type'
      - $ref: '#/components/parameters/event_severity'
      responses:
        '200':
          description: The list of events which fulfills the query parameters filter
          content:
            application/json:
              schema:
                description: The list of log lines
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
              example:
                data:
                - icon: fa-info-circle
                  id: 42
                  message: Cyclobot created the build cleanup-deployment#42 of pipeline awesome-project-pr_1337
                  severity: info
                  tags:
                  - key: action
                    value: create
                  - key: entity
                    value: build
                  - key: name
                    value: awesome-project-pr_1337/cleanup-deployment
                  - key: user
                    value: cyclobot
                  timestamp: 123456789000
                  title: A build has been created
                  type: Cycloid
                - icon: fa-info-circle
                  id: 2
                  message: A new deployment of awesome-project version 1.1.93-rc.5 has been done on staging environment
                  severity: info
                  tags:
                  - key: env
                    value: staging
                  - key: project
                    value: awesome-project
                  timestamp: 123456795000
                  title: Success deployment of awesome-project version 1.1.93-rc.5 on staging environment
                  type: Custom
                - id: 3
                  message: Kubernetes nodes of the deployment awesome-project are under heavy load
                  severity: warn
                  tags:
                  - key: Name
                    value: my-mum-kubernetes-prod
                  - key: UUID
                    value: 3ec0a46e-435e-4c5e-989b-02179efb49b5
                  - key: alertname
                    value: K8SNodeDiskPressure
                  - key: condition
                    value: DiskPressure
                  - key: customer
                    value: awesome-customer
                  - key: env
                    value: prod
                  - key: instance
                    value: 172.30.12.2338080
                  - key: job
                    value: kube-state-metrics
                  - key: node
                    value: ip-127-0-0-1.eu-west-1.compute.internal
                  - key: project
                    value: kubernetes
                  - key: receiver
                    value: on_call
                  - key: service
                    value: k8s
                  - key: severity
                    value: warning
                  - key: status
                    value: false
                  timestamp: 123456810000
                  title: Nodes are overloaded
                  type: Monitoring
                - icon: fa-aws
                  id: 5
                  message: A new AWS instance has been created
                  severity: info
                  tags:
                  - key: env
                    value: testing
                  - key: project
                    value: awesome-project
                  timestamp: 123456823000
                  title: AWS created
                  type: AWS
                - icon: fa-aws
                  id: 7
                  message: A new AWS instance is ready to accept requests
                  severity: info
                  tags:
                  - key: env
                    value: testing
                  - key: project
                    value: secret-project
                  timestamp: 123456834000
                  title: AWS is ready
                  type: AWS
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get events
      x-summary-source: derived
    post:
      description: Send a event on the organization to be registered.
      tags:
      - Organizations
      operationId: sendEvent
      responses:
        '200':
          description: Event has been registered
          content:
            application/json:
              schema:
                description: The newly created event
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
              example:
                data:
                - icon: fa-info-circle
                  message: A new member has been added to the project Website
                  severity: info
                  tags:
                  - key: project_canonical
                    value: website
                  - key: environment_canonical
                    value: development
                  - key: user
                    value: batman
                  timestamp: 123456789000
                  title: New member added
                  type: Cycloid
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewEvent'
        description: The information associated with the event to register.
        required: true
      summary: Send event
      x-summary-source: derived
  /organizations/{organization_canonical}/events/count:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Retrieve a count of events for given parameters
      tags:
      - Organizations
      operationId: getEventsCount
      parameters:
      - $ref: '#/components/parameters/timestamp_range_begin_query'
      - $ref: '#/components/parameters/timestamp_range_end_query'
      - $ref: '#/components/parameters/events_count_granularity_filter'
      - $ref: '#/components/parameters/project_canonical_query'
      responses:
        '200':
          description: The count of events which fulfills the query parameters filter
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventsCount'
              example:
                data:
                - count: 10
                  end: 1514851200000
                  start: 1514764800000
                - count: 20
                  end: 1514937600000
                  start: 1514851200000
                - count: 30
                  end: 1515024000000
                  start: 1514937600000
                - count: 40
                  end: 1515110400000
                  start: 1515024000000
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get events count
      x-summary-source: derived
  /organizations/{organization_canonical}/events/tags:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical_query'
    get:
      description: Retrieve the list of tags and set of values for all the events of the organization.
      tags:
      - Organizations
      operationId: getEventsTags
      responses:
        '200':
          description: The list of tags and set of values for all the events of the organization.
          content:
            application/json:
              schema:
                description: The list of tags with associated set of values
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
              example:
                data:
                  action:
                  - create
                  - delete
                  - update
                  customer:
                  - awesome-customer
                  - cycloid
                  entity:
                  - build
                  - pipeline
                  env:
                  - prod
                  - staging
                  - testing
                  name:
                  - awesome-project-pr_1337
                  - awesome-project-pr_42
                  project:
                  - awesome-project
                  - pet-project
                  - secret-project
                  user:
                  - cycloidbot
                  - geralt-of-rivia
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get events tags
      x-summary-source: derived
  /organizations/{organization_canonical}/messages:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Returns the messages associated to the organization.
      tags:
      - Organizations
      summary: Get the organization messages
      operationId: getOrganizationMessages
      responses:
        '200':
          description: Message retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMessages'
              example:
                data:
                  creation_restricted_message: Organization creation is disabled for your account
        '401':
          description: Unauthorized.
        default:
          $ref: '#/components/responses/unexpected_error'
    put:
      description: Updates the messages associated to the organization.
      tags:
      - Organizations
      summary: Update the organization messages
      operationId: updateOrganizationMessages
      responses:
        '200':
          description: Messages updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMessages'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMessages'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMessages'
        required: true
  /organizations/{organization_canonical}/nav:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      security:
      - api_key: []
      description: Get the sidebar nav ordering config for the organization.
      tags:
      - Organizations
      operationId: getOrgNav
      responses:
        '200':
          description: Nav ordering config.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NavConfig'
        '401':
          $ref: '#/components/responses/unauthenticated'
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get org nav
      x-summary-source: derived
    put:
      security:
      - api_key: []
      description: Create or replace the sidebar nav ordering config for the organization. Sending an empty items array resets to default ordering.
      tags:
      - Organizations
      operationId: updateOrgNav
      responses:
        '200':
          description: Updated nav ordering config.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NavConfig'
        '401':
          $ref: '#/components/responses/unauthenticated'
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
