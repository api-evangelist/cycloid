      title: An event
      required:
      - id
      - timestamp
      - type
      - title
      - message
      - severity
      - tags
      properties:
        color:
          description: 'The HTML color associated to the event. The valid colors are the ones listed in the  CSS 2 specification: https://www.w3.org/TR/CSS2/syndata.html#value-def-color. Only the keyword are accepted, the hexadecimal values are not valid.'
          type: string
          maxLength: 20
          minLength: 3
          pattern: '[a-z]+'
        icon:
          description: '[A Font Awesome class name](https://fontawesome.com/icons)'
          type: string
          minLength: 3
        id:
          description: The unique ID of the event from the database.
          type: integer
          format: uint32
        message:
          description: The message associated to the event.
          type: string
          minLength: 1
        severity:
          description: The severity associated to the event.
          type: string
          enum:
          - info
          - warn
          - err
          - crit
        tags:
          description: The list of tags associated to the event.
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        timestamp:
          description: The timestamp when the event was created in milliseconds.
          type: integer
          format: uint64
        title:
          description: The title of the event.
          type: string
          minLength: 1
        type:
          description: The type of the event
          type: string
          enum:
          - Cycloid
          - AWS
          - Monitoring
          - Custom
    SimpleTeam:
      description: The entity which represents the information of a team a bit simplified.
      type: object
      title: SimpleTeam
      required:
      - id
      - canonical
      - name
      - created_at
      - updated_at
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        created_at:
          type: integer
          format: uint64
        id:
          type: integer
          format: uint32
          minimum: 1
        name:
          type: string
          minLength: 2
        owner:
          description: 'Organization member that owns this team. When a user is the owner of a

            team it has all the permissions on it.

            In the event where the user has been deleted this field might be empty.

            '
          $ref: '#/components/schemas/User'
        updated_at:
          type: integer
          format: uint64
    NewOrganization:
      description: The entity which represents a new organization to create in the application.
      type: object
      title: Create Organization
      required:
      - name
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        name:
          type: string
          minLength: 2
    Summary:
      type: object
      title: Summary of the organization
      required:
      - projects
      - pipelines
      - credentials
      - service_catalog_sources
      - config_repositories
      - teams
      - users
      - roles
      - service_catalogs
      properties:
        config_repositories:
          type: integer
          format: uint64
        credentials:
          type: integer
          format: uint64
        pipelines:
          type: integer
          format: uint64
        projects:
          type: integer
          format: uint64
        roles:
          type: integer
          format: uint64
        service_catalog_sources:
          type: integer
          format: uint64
        service_catalogs:
          type: integer
          format: uint64
        teams:
          type: integer
          format: uint64
        users:
          type: integer
          format: uint64
    Appearance:
      description: An Appearance holds the values of the branding configuration, which are rendered across an organization
      title: Appearance
      required:
      - canonical
      - name
      - display_name
      - tab_title
      - color
      - logo
      - favicon
      - footer
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        color:
          type: object
          required:
          - r
          - g
          - b
          properties:
            b:
              description: Blue color value of the RGB color
              type: integer
              format: uint32
              maximum: 255
            g:
              description: Green color value of the RGB color
              type: integer
              format: uint32
              maximum: 255
            r:
              description: Red color value of the RGB color
              type: integer
              format: uint32
              maximum: 255
        created_at:
          type: integer
          format: uint64
        display_name:
          type: string
          maxLength: 50
          minLength: 1
        favicon:
          type: string
          format: uri
        footer:
          type: string
          maxLength: 1000
        is_active:
          type: boolean
        logo:
          type: string
          format: uri
        name:
          type: string
          maxLength: 50
          minLength: 1
        tab_title:
          type: string
          maxLength: 50
          minLength: 1
        updated_at:
          type: integer
          format: uint64
    ErrorDetailsItem:
      description: Represents an item of the list of details of an error.
      title: Error details item
      required:
      - message
      - code
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: string
        message:
          type: string
    NewEvent:
      description: A new event to register in the Cycloid platform.
      title: A new event
      required:
      - type
      - title
      - message
      - severity
      - tags
      properties:
        color:
          description: 'The HTML color associated to the event. The valid colors are the ones listed in the  CSS 2 specification: https://www.w3.org/TR/CSS2/syndata.html#value-def-color. Only the keyword are accepted, the hexadecimal values are not valid.'
          type: string
          maxLength: 20
          minLength: 3
          pattern: '[a-z]+'
        icon:
          description: '[A Font Awesome class name](https://fontawesome.com/icons)'
          type: string
          minLength: 3
        message:
          description: The message associated to the event.
          type: string
          minLength: 1
        severity:
          description: tThe severity associated to the event.
          type: string
          enum:
          - info
          - warn
          - err
          - crit
        tags:
          description: The list of tags associated to the event.
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        title:
          description: The title of the event.
          type: string
          minLength: 1
        type:
          description: The type of the event
          type: string
          enum:
          - Cycloid
          - AWS
          - Monitoring
          - Custom
  responses:
    unauthenticated:
      description: The user cannot be authenticated with the credentials which she/he has used.
      headers:
        Content-Length:
          description: The length of the response body in octets (8-bit bytes).
          schema:
            type: integer
            format: uint64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
          example:
            errors:
            - code: Unauthenticated
              message: invalid credentials
    unexpected_error:
      description: The response sent when an unexpected error happened, as known as an internal server error.
      headers:
        Content-Length:
          description: The length of the response body in octets (8-bit bytes).
          schema:
            type: integer
            format: uint64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
          example:
            errors:
            - code: Unexpected
              message: Server Internal error
    not_enough_permissions:
      description: The authenticated user cannot perform the operation because, it doesn't have permissions for such operation.
      headers:
        Content-Length:
          description: The length of the response body in octets (8-bit bytes).
          schema:
            type: integer
            format: uint64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
          example:
            errors:
            - code: Unauthorized
              message: Not enough permissions to perform the operation
    required_content_length_header:
      description: The request has a body but it doesn't have a Content-Length header.
    not_found_entity_in_path:
      description: The response sent when any of the entities present in the path is not found.
      headers:
        Content-Length:
          description: The length of the response body in octets (8-bit bytes).
          schema:
            type: integer
            format: uint64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
          example:
            errors:
            - code: NotFoundEntity
              message: Entity not found
    unprocessable_entity:
      description: All the custom errors that are generated from the Cycloid API
      headers:
        Content-Length:
          description: The length of the response body in octets (8-bit bytes).
          schema:
            type: integer
            format: uint64
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
          example:
            errors:
            - code: SomeCode
              message: some error
  securitySchemes:
    api_key:
      description: The API authorization is done with JWT tokens
      type: apiKey
      name: Authorization
      in: header
    api_key_query:
      description: The API authorization is done with JWT tokens in the query string
      type: apiKey
      name: api_key
      in: query
