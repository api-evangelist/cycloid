      type: object
      title: CanDoOutput
      required:
      - ok
      properties:
        entity_canonicals:
          type: array
          items:
            type: string
        ok:
          type: boolean
    NavConfig:
      description: Sidebar nav ordering configuration for an organization.
      type: object
      title: NavConfig
      properties:
        items:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NavItem'
    Organization:
