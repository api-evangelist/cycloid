      properties:
        action:
          type: string
        canonical:
          description: A client-chosen key used to identify this action in the response map
          type: string
          minLength: 1
        entity_canonicals:
          description: List of the canonicals to the Resource excluding the Organization
          type: array
          items:
            type: string
    SubscriptionPlan:
