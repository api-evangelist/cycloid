components:
  parameters:
    event_severity:
      description: Specify the severities of the events to be requested. The returned events must have one of the specified severities.
      name: severity
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          enum:
          - info
          - warn
          - err
          - crit
          type: string
    timestamp_range_begin_query:
      description: The unix timestamp in milliseconds, which indicate the start of the time range.
      name: begin
      in: query
      schema:
        type: integer
        format: uint64
    order_by_query:
      description: 'Allows to order the list of items. Example usage: field_name:asc. Multiple order_by parameters are allowed, applied in the order they are specified.

        '
      name: order_by
      in: query
      schema:
        type: string
    credential_canonical_not_required_query:
      description: A Credential canonical
      name: credential_canonical
      in: query
      schema:
        type: string
        maxLength: 100
        minLength: 2
        pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    events_count_granularity_filter:
      description: Sets the events count granularity, it can be month, week, day.
      name: events_count_granularity
      in: query
      required: true
      schema:
        type: string
        enum:
        - month
        - week
        - day
    git_url_query:
      description: Git URL to repository
      name: git_url
      in: query
      required: true
      schema:
        type: string
        pattern: ^((/|~)[^/]*)+.(\.git)|(([\w\]+@[\w\.]+))(:(//)?)([\w\.@\:/\-~]+)(/)?
    event_type:
      description: Specify the types of the events to be requested. The returned events must have one of the specified types.
      name: type
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          enum:
          - Cycloid
          - AWS
          - Monitoring
          - Custom
          type: string
    organization_canonical:
      description: A canonical of an organization.
      name: organization_canonical
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 2
        pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    project_canonical_query:
      description: A list of projects' canonical to filter from
      name: project_canonical
      in: query
      schema:
        type: string
        pattern: ^[\da-z]+(?:(?:[\da-z\-._]+)?[\da-z])?$
    page_size:
      description: The number of items at most which the response can have.
      name: page_size
      in: query
      schema:
        type: integer
        format: uint32
        default: 100
    timestamp_range_end_query:
      description: The unix timestamp in milliseconds, which indicate the end of the time range.
      name: end
      in: query
      schema:
        type: integer
        format: uint64
    page_index:
      description: The page number to request. The first page is 1.
      name: page_index
      in: query
      schema:
        type: integer
        format: uint32
        default: 1
  schemas:
    UpdateOrganization:
      description: The entity which represents the information of an organization to be updated.
      type: object
      title: Update Organization
      required:
      - name
      properties:
        can_children_create_appearance:
          description: Omitting this field or sending null preserves the current value.
          type:
          - boolean
          - 'null'
        can_children_manage_oidc_mapping:
          description: Omitting this field or sending null preserves the current value.
          type:
          - boolean
          - 'null'
        can_children_use_dedicated_authentication:
          description: Omitting this field or sending null preserves the current value.
          type:
          - boolean
          - 'null'
        creation_restricted_message:
          description: Message displayed to users when organization creation is restricted
          type:
          - string
          - 'null'
        disable_cost_estimation:
          description: 'When true, the StackForms cost estimation panel is hidden on every organization of the platform. Only the root organization can set it to true: sending true for a sub-organization is rejected with a 422 error, while false is accepted anywhere. Omitting this field or sending null preserves the current value.'
          type:
          - boolean
          - 'null'
        disable_member_invitation_email:
          description: 'When true, adding a member sends no invitation email, platform-wide. Only the root organization can set it to true: sending true for a sub-organization is rejected with a 422 error, while false is accepted anywhere. Omitting this field or sending null preserves the current value.'
          type:
          - boolean
          - 'null'
        disable_signup:
          description: 'When true, signups are rejected everywhere on the platform (plain email/password, AWS Marketplace, and SSO/social auto-enrollment) unless the email is already invited — same gate as sso_invite_only. Only the root organization can set it to true: sending true for a sub-organization is rejected with a 422 error, while false is accepted anywhere. Omitting this field or sending null preserves the current value.'
          type:
          - boolean
          - 'null'
        hide_stack_version_out_of_sync:
          description: When true, the component list and project list hide the indicator shown when a version's commit no longer matches its reference commit. Other version status indicators are unaffected. Omitting this field or sending null preserves the current value.
          type:
          - boolean
          - 'null'
        impersonation_emails:
          description: Emails of the users allowed to impersonate other users. A non-empty list is accepted on the root organization only, any other organization gets a 422. Emails are trimmed, lowercased and deduplicated before being stored. Omitting this field or sending null preserves the current value. Send an empty array [] to clear the list.
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: string
            maxLength: 255
            pattern: ^\S+@\S+\.\S+$
        is_using_dedicated_authentication:
          description: Omitting this field or sending null preserves the current value.
          type:
          - boolean
          - 'null'
        mfa_enabled:
          description: Omitting this field or sending null preserves the current value.
          type:
          - boolean
          - 'null'
        name:
          type: string
          minLength: 2
        sso_invite_only:
          description: When true, SSO users can only join the organization if they have been explicitly invited
          type:
          - boolean
          - 'null'
        stack_branch_exclude_patterns:
          description: Glob patterns (filepath.Match syntax). Versions matching any of these are hidden from non-team-member users. Omitting this field or sending null preserves the current value. Send an empty array [] to clear all patterns.
          type:
          - array
          - 'null'
          maxItems: 50
          items:
            type: string
            maxLength: 200
        stack_branch_include_patterns:
          description: Glob patterns (filepath.Match syntax). When set, only versions whose name matches at least one pattern are shown to non-team-member users. Empty means show all. Omitting this field or sending null preserves the current value. Send an empty array [] to clear all patterns.
          type:
          - array
          - 'null'
          maxItems: 50
          items:
            type: string
            maxLength: 200
    CanDoInput:
      description: The input of the 'can_do' endpoint
      type: object
      title: CanDoInput
      required:
      - action
      - entity_canonicals
      properties:
        action:
          type: string
        entity_canonicals:
          description: List of the canonicals to the Resource excluding the Organization
          type: array
          items:
            type: string
    Subscription:
