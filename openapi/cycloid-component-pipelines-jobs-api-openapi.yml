tags:
- description: Operations on the jobs of a pipeline in a component
  name: Component Pipelines Jobs
paths:
  ? /organizations/{organization_canonical}/projects/{project_canonical}/environments/{environment_canonical}/components/{component_canonical}/pipelines/{inpath_pipeline_name}/jobs
  : parameters:
