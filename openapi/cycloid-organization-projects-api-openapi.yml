            type: string
        message:
          type: string
    Component:
      description: The entity which represents the information of a component.
      type: object
      title: Component
      required:
      - id
      - canonical
      - name
      - created_at
      - updated_at
      - service_catalog
      - environment
      - project
      - version
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[\da-zA-Z]+(?:(?:[\da-zA-Z\-._]+)?[\da-zA-Z])?$
        cloud_provider:
          description: 'The cloud provider object that this environment is using.

            In the event where the cloud provider is not yet defined/supported

            that field might be empty.

            '
          $ref: '#/components/schemas/CloudProvider'
        config_repository_sync_status:
          description: Status of the asynchronous projection of this component's saved StackForms configuration to its project's config git repository. The configuration is always persisted (DB source of truth); this reports whether the git mirror is up to date, catching up, or failing. Absent when there is nothing pending to mirror.
          $ref: '#/components/schemas/ConfigRepositorySyncStatus'
        config_revision:
          description: 'The revision of this component''s StackForms configuration currently mirrored to the config git repository, and therefore the one a build started now would plan against. Unlike config_repository_sync_status it is reported even when the mirror is up to date, so an automation that wrote a configuration can confirm the revision a build will read is its own, and match it against the config_revision reported when creating a build. Absent when the component has no saved configuration.

            '
          type: integer
          format: uint64
        created_at:
          type: integer
          format: uint64
        description:
          type: string
        environment:
          description: The environment object that this component is using.
          $ref: '#/components/schemas/Environment'
        id:
          type: integer
          format: uint32
          minimum: 1
        is_configured:
          description: The status of the component.
          type: boolean
        name:
          type: string
          minLength: 1
        project:
          description: The project object that this component is using.
          $ref: '#/components/schemas/ProjectSimple'
        service_catalog:
          description: The Service Catalog that was used to create project.
          $ref: '#/components/schemas/ServiceCatalog'
        stackform_updated_at:
          description: Unix timestamp in milliseconds of when the component was last configured via StackForms. Absent if the component has never been configured or the information is unavailable.
          type: integer
          format: uint64
        updated_at:
          type: integer
          format: uint64
        use_case:
          type: string
          maxLength: 100
          minLength: 1
          pattern: (^[a-z0-9]+(([a-z0-9\-_]+)?[a-z0-9]+)?$)
        version:
          description: The version used by the Component
          $ref: '#/components/schemas/ServiceCatalogSourceVersion'
    NewProject:
      description: The entity which represents the information of a new project.
      type: object
      title: Create Project
      required:
      - name
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: (^[a-z0-9]+(([a-z0-9\-_]+)?[a-z0-9]+)?$)
        color:
          type: string
          maxLength: 64
        config_repository_canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        description:
          description: 'A description regarding the project to help identify/remember details,

