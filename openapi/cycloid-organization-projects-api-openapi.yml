        name:
          type: string
          minLength: 1
        owner:
          description: 'Organization member that owns this project. When a user is the owner of a

            project it has all the permissions on it.

            In the event where the user has been deleted that field might be empty.

            '
          $ref: '#/components/schemas/User'
        updated_at:
          type: integer
          format: uint64
        version_status:
          description: Aggregated value of the Environments Components Version.Status
          type: array
          items:
            type: string
            enum:
            - no_status
            - latest
            - active
            - deleted
            - outdated
    EnvironmentVariableItem:
      description: A single key/value pair attached to an Environment. The value is surfaced to interpolation contexts (StackForms, value_ref, pipelines, Terraform templates) under the `.environment.variables` template path.
      title: Environment Variable Item
      required:
      - key
      - type
      - value
      properties:
        created_at:
          description: The date and time (unix timestamp) the variable was created.
          type: integer
          format: uint64
          readOnly: true
        description:
          description: Optional free-form description of the variable.
          type: string
          maxLength: 1000
        key:
          description: Identifier used to reference the variable in templates (e.g. `($ .environment.variables.my_key $)`). Must not contain dots and must include at least one alphanumeric character.
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[^.]*[A-Za-z0-9][^.]*$
        sensitive:
          description: Display hint for the UI to mask this value. The API returns the value in plaintext regardless.
          type: boolean
          default: false
        type:
          description: Declared shape of the value. Names mirror stackforms widget types so the two APIs stay consistent.
          type: string
          enum:
          - string
          - boolean
          - integer
          - float
          - array
          - map
        updated_at:
          description: The date and time (unix timestamp) the variable was last updated.
          type: integer
          format: uint64
          readOnly: true
        value:
          description: 'The variable value. Its shape must match the `type` field: a JSON string, boolean, integer, float, array or object respectively.'
          type: object
    ProjectSimple:
      description: The entity which represents minimal information of a project.
      type: object
      title: ProjectSimple
      required:
      - id
      - canonical
      - name
      - created_at
      - updated_at
      - color
      - icon
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: (^[a-z0-9]+(([a-z0-9\-_]+)?[a-z0-9]+)?$)
        color:
          type: string
          maxLength: 64
        created_at:
          type: integer
          format: uint64
        description:
          type: string
        favorite:
          type: boolean
        icon:
          type: string
          maxLength: 64
        id:
          type: integer
          format: uint32
          minimum: 1
        name:
          type: string
          minLength: 1
        owner:
          description: 'Organization member that owns this project. When a user is the owner of a

            project it has all the permissions on it.

            In the event where the user has been deleted that field might be empty.

            '
          $ref: '#/components/schemas/User'
        updated_at:
          type: integer
          format: uint64
    UpdateProject:
      description: The entity which represents the information of the project to be updated.
      type: object
      title: Update Project
      required:
      - name
      properties:
        cloud_provider:
          description: 'The cloud provider canonical that this project is using - between the

            supported ones.

            '
          type: string
          enum:
          - aws
          - google
          - azurerm
          - flexibleengine
          - openstack
        color:
          type: string
          maxLength: 64
        config_repository_canonical:
          description: 'The config_repository_canonical points to new Config Repository the project

            will be using. If this value is filled and it''s different from the

            current one, the whole project will be migrated to new CR, meaning

            configuration files will also be moved.

            If the project didn''t have config_repository_canonical set, this action will

            only attach the project to the CR, it won''t create/move any files.

            In order to be sure everything works, make sure the

            config_repository_canonical is pointing at the CR with the same git

            repository that was used during project creation.

            Although the config_repository_canonical is not marked as required,

            it''s actually required for projects that are already using CR. This

            field not being required is only for compatibility with older projects,

            which are not having CR yet.

            '
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        description:
          type: string
        icon:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
        owner:
          description: 'User canonical that owns this project. Only the owner or an

            organization admin can update such a field. When a user is the owner

            of a project it has all the permission on it.

            '
          type: string
      additionalProperties: false
    Environment:
      description: Represent an environment that belongs to an organization. This is the base environment entity without project-specific relations.
      title: Environment
      required:
      - id
      - canonical
      - created_at
      - updated_at
      - resources_count
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[\da-zA-Z]+(?:[\da-zA-Z\-._]+[\da-zA-Z]|[\da-zA-Z])$
        cloud_accounts:
          type: array
          items:
            $ref: '#/components/schemas/CloudAccountSimple'
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        created_at:
          type: integer
          format: uint64
        description:
          description: Optional description of the environment
          type: string
          maxLength: 1000
        environment_type:
          $ref: '#/components/schemas/EnvironmentType'
        id:
          type: integer
          format: uint32
          minimum: 1
        name:
          description: The display name of the environment
          type: string
          maxLength: 100
          minLength: 1
        owner:
          description: 'Organization member that owns this environment. When a user is the owner of an

            environment it has all the permissions on it.

            In the event where the user has been deleted this field might be empty.

            '
          $ref: '#/components/schemas/User'
        resources_count:
          description: The total count of resources attributed to this environment
          type: integer
          format: uint32
        updated_at:
          type: integer
          format: uint64
        variables:
          description: Full set of environment variables attached to this environment, available under the `.environment.variables` template path during interpolation.
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariableItem'
        version_status:
          description: Aggregated value of the Components Version.Status in this environment. Only populated when the environment is returned alongside a Project.
          type: array
          items:
            type: string
            enum:
            - no_status
            - latest
            - active
            - deleted
            - outdated
    User:
      description: A summary of a user to be used in places where only the basic information are need or are enough.
      type: object
      title: Basic info of a user
      required:
      - id
      - username
      - full_name
      - email
      - locale
      - created_at
      - mfa_enabled
      properties:
        country_code:
          description: Code of a country the user is from in alpha-2 format
          type: string
          pattern: ^[A-Z]{2}$
        created_at:
          description: When the user became a member.
          type: integer
          format: uint64
        email:
          description: User's primary email.
          type: string
          format: email
        full_name:
          type: string
        id:
          type: integer
          format: uint32
          minimum: 1
        last_login_at:
          description: When the user logged in last time.
          type: integer
          format: uint64
        locale:
          description: The local that the user prefer.
          type: string
          pattern: ^[a-z]{2}(?:-[a-z][a-z])?$
        mfa_enabled:
          type: boolean
        picture_url:
          type: string
          format: uri
        updated_at:
          description: When the user had the role modified.
          type: integer
          format: uint64
        username:
          type: string
          maxLength: 30
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    Build:
      description: The information relative to a build.
      type: object
      title: Build
      required:
      - id
      - team_name
      - name
      - status
      - api_url
      properties:
        api_url:
          type: string
        config_revision:
          description: 'The revision of the component configuration this build was gated on, set when the build is created. The component configuration is mirrored to the config repository asynchronously; creating a build waits for the acknowledged revision to be visible to the CI, and reports it here so a caller can tie the build back to the configuration write it made. Absent on builds read back later, and on components with no saved configuration.

            '
          type: integer
          format: uint64
        end_time:
          type: integer
          format: uint64
        id:
          type: integer
          format: uint64
        job_name:
          type: string
        name:
          type: string
        pipeline_id:
          type: integer
          format: uint64
        pipeline_name:
          type: string
        reap_time:
          type: integer
          format: uint64
        start_time:
          type: integer
          format: uint64
        status:
          type: string
        team_name:
          type: string
    LabelSelector:
      description: Constrains which stacks are offered in environments of a given type, based on the stack's labels. Every requirement must be satisfied for a stack to match.
      title: Label Selector
      required:
      - requirements
      properties:
        enforcement:
          description: '''soft'' only filters the available-stacks list; ''hard'' also rejects creating a component from a non-matching stack.'
          type: string
          default: soft
          enum:
          - soft
          - hard
        requirements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LabelSelectorRequirement'
    ErrorPayload:
      description: 'The payload used by the server to response to the client with an Error, those errors could be any of the ones listed [here](https://github.com/cycloidio/youdeploy-http-api/blob/develop/errors/code.go#L10), only the CODE of the error is the one that is guaranteed to not change between the same major version, the MESSAGE could change.

        '
      title: Error Payload
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetailsItem'
        request_id:
          type: string
    SimpleTeam:
      description: The entity which represents the information of a team a bit simplified.
      type: object
