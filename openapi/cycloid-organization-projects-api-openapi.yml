openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Organization projects API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- description: Operations for projects which belong to an organization.
  name: Organization projects
paths:
  /organizations/{organization_canonical}/projects:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: 'Get list of projects of the organization. Projects can also be filtered by service catalog (stack) or by component using LHS query filters: `service_catalog_ref[eq]={organization}:{catalog}` (e.g. `?service_catalog_ref[eq]=my-org:my-stack`) and `component_canonical[eq]=value`. The `in` operator with a comma-separated list of values is also supported for both.'
      tags:
      - Organization projects
      operationId: getProjects
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/project_name_query'
      - $ref: '#/components/parameters/project_created_at_query'
      - $ref: '#/components/parameters/project_description_query'
      - $ref: '#/components/parameters/project_config_repository_canonical_query'
      - $ref: '#/components/parameters/service_catalog_source_canonical_query'
      - $ref: '#/components/parameters/owner_query'
      - $ref: '#/components/parameters/order_by_query'
      - $ref: '#/components/parameters/favorite'
      - $ref: '#/components/parameters/environment_canonical_query'
      responses:
        '200':
          description: List of the projects which the organization has.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - canonical: proj-1
                  cloud_provider:
                    abbreviation: AWS
                    canonical: aws
                    created_at: 1503225026
                    id: 4
                    name: Amazon Web Services
                    updated_at: 1503335026
                  created_at: 1503225026
                  description: my-description1
                  environments:
                  - dev
                  - staging
                  - production
                  favorite: true
                  id: 1
                  name: Project 1
                  owner:
                    created_at: 1503225026
                    email: mariano.jimenez@fakeemail.com
                    full_name: Mariano Jimenez
                    id: 1
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: Organization existing role
                      id: 17
                      name: existing
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-1
                  service_catalog_name: Magento Stack
                  service_catalog_ref: cycloidio:stack-magento
                  updated_at: 1503335026
                - canonical: proj2
                  cloud_provider:
                    abbreviation: GCP
                    canonical: google
                    created_at: 1503225026
                    id: 2
                    name: Google Cloud Platform
                    updated_at: 1503335026
                  created_at: 1501131026
                  description: my-description2
                  environments:
                  - dev
                  - staging
                  favorite: true
                  id: 1
                  name: Project 2
                  service_catalog_name: Magento Stack 2
                  service_catalog_ref: cycloidio:stack-magento2
                  updated_at: 1503333026
                - canonical: proj3
                  created_at: 1500135021
                  description: my-description3
                  environments: null
                  favorite: true
                  id: 1
                  name: Project 3
                  service_catalog_name: Some other stack
                  service_catalog_ref: cycloidio:stack-something
                  updated_at: 1503332021
                - canonical: proj-4
                  created_at: 1500035021
                  description: my-description4
                  environments:
                  - dev
                  - staging
                  - production
                  favorite: false
                  id: 1
                  name: Project 4
                  owner:
                    created_at: 1503225026
                    email: mariana.jimenezo@fakeemail.com
                    full_name: Mariana Jimenezo
                    id: 10
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: Organization existing role
                      id: 17
                      name: existing
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-2
                  service_catalog_name: Magento Stack 3
                  service_catalog_ref: cycloidio:stack-magento3
                  updated_at: 1502332021
                pagination:
                  index: 1
                  size: 10
                  total: 4
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get projects
      x-summary-source: derived
    post:
      description: Create a new project with pipelines in the organization.
      tags:
      - Organization projects
      operationId: createProject
      responses:
        '200':
          description: Project created. The body contains the information of the new project of the organization.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
              example:
                data:
                  canonical: proj3
                  created_at: 1500135021
                  description: the-description
                  id: 1
                  name: Project 3
                  owner:
                    created_at: 1503225026
                    email: mariano.jimenez@fakeemail.com
                    full_name: Mariano Jimenez
                    id: 1
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: Organization existing role
                      id: 17
                      name: existing
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-1
                  service_catalog:
                    author: Cycloid CI
                    canonical: stack-foo
                    description: CI sample
                    directory: /config
                    id: 1
                    keywords:
                    - ci
                    name: foo
                    ref: cycloid:stack-foo
                    service_catalog_source_id: 1
                    trusted: true
                  updated_at: 1503332021
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewProject'
        description: 'The information of the project to create.

          '
        required: true
      summary: Create project
      x-summary-source: derived
  /organizations/{organization_canonical}/projects/{project_canonical}:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    get:
      description: Get a project of the organization.
      tags:
      - Organization projects
      operationId: getProject
      responses:
        '200':
          description: The information of the project of the organization which has the specified ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
              example:
                data:
                  canonical: proj2
                  created_at: 1501131026
                  environments:
                  - canonical: staging
                    created_at: 1503225026
                    id: 2
                    updated_at: 1503335026
                    use_case: uc
                  - canonical: dev
                    created_at: 1503225026
                    id: 3
                    updated_at: 1503335026
                    use_case: uc2
                  id: 1
                  name: Project 2
                  owner:
                    created_at: 1503225026
                    email: mariano.jimenez@fakeemail.com
                    full_name: Mariano Jimenez
                    id: 1
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: Organization existing role
                      id: 17
                      name: existing
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-1
                  service_catalog:
                    author: Cycloid CI
                    canonical: stack-foo
                    description: CI sample
                    directory: /config
                    id: 1
                    keywords:
                    - ci
                    name: foo
                    ref: cycloid:stack-foo
                    service_catalog_source_id: 1
                    trusted: true
                  updated_at: 1503333026
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get project
      x-summary-source: derived
    put:
      description: Update the information of a project of the organization. If the project has some information on the fields which aren't required and they are not sent or set to their default values, which depend of their types, the information will be removed.
      tags:
      - Organization projects
      operationId: updateProject
      responses:
        '200':
          description: Project updated. The body contains information of the updated project.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
              example:
                data:
                  canonical: proj-1
                  config_repository_canonical: stack-magento-cr
                  created_at: 1503225026
                  id: 1
                  name: Project 1
                  owner:
                    created_at: 1503225026
                    email: mariano.jimenez@fakeemail.com
                    full_name: Mariano Jimenez
                    id: 10
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: Organization existing role
                      id: 17
                      name: existing
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-1
                  service_catalog:
                    author: Cycloid CI
                    canonical: stack-foo
                    description: CI sample
                    directory: /config
                    id: 1
                    keywords:
                    - ci
                    name: foo
                    ref: cycloid:stack-foo
                    service_catalog_source_id: 1
                    trusted: true
                  service_catalog_ref: cycloidio:stack-magento
                  updated_at: 1503335026
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateProject'
        description: The information of the project to update.
        required: true
      summary: Update project
      x-summary-source: derived
    delete:
      description: Delete a project of the organization.
      tags:
      - Organization projects
      operationId: deleteProject
      parameters:
      - $ref: '#/components/parameters/ignore_config_files_err'
      - $ref: '#/components/parameters/skip_hooks'
      responses:
        '200':
          description: 'This status code is returned when some components belonging to the project use on_delete hooks.

            The hooks have been triggered but the project still exists.

            Use skip_hooks=true to delete the project skipping the hooks.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Build'
        '204':
          description: Project has been deleted.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete project
      x-summary-source: derived
  /organizations/{organization_canonical}/projects/{project_canonical}/environments:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    get:
      description: Get all the environments of the project
      tags:
      - Organization projects
      operationId: getProjectEnvironments
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Returns all the project Environments
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectEnvironment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - canonical: staging
                  components:
                  - canonical: component1
                    created_at: 1503225026
                    id: 1
                    name: Component 1
                    service_catalog:
                      author: Cycloid
                      canonical: stack-magento
                      created_at: 1503225026
                      description: Super magento stack
                      directory: /config
                      id: 1
                      image: http://via.placeholder.com/150x150
                      keywords:
                      - stack
                      - php
                      name: stack-magento
                      ref: orgCanonical:stackCanonical
                      service_catalog_source_canonical: scscan
                      technologies:
                      - technology: nginx
                        version: '1.15'
                      trusted: true
                      type: stack
                      updated_at: 1503335026
                      visibility: local
                    updated_at: 1503335026
                    use_case: prod
                  - canonical: prod
                    created_at: 1503225026
                    id: 2
                    updated_at: 1503335026
                  created_at: 1503225026
                  id: 2
                  updated_at: 1503335026
                - canonical: dev
                  created_at: 1503225026
                  id: 3
                  updated_at: 1503335026
                pagination:
                  index: 1
                  size: 10
                  total: 2
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get project environments
      x-summary-source: derived
    post:
      description: Link an environment to a project
      tags:
      - Organization projects
      operationId: linkEnvironmentToProject
      responses:
        '200':
          description: Environment linked to project successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectEnvironment'
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              type: object
              required:
              - environment_canonical
              properties:
                environment_canonical:
                  description: The canonical name of the environment to link
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - environment_canonical
              properties:
                environment_canonical:
                  description: The canonical name of the environment to link
                  type: string
        description: Environment link data
        required: true
      summary: Link environment to project
      x-summary-source: derived
  /organizations/{organization_canonical}/projects/{project_canonical}/environments/{environment_canonical}:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    - $ref: '#/components/parameters/environment_canonical'
    get:
      description: Get a project environment of the organization.
      tags:
      - Organization projects
      operationId: getEnvironment
      responses:
        '200':
          description: The body contains the environment.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectEnvironment'
              example:
                data:
                  color: lime
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get environment
      x-summary-source: derived
    delete:
      description: Delete a project environment link
      tags:
      - Organization projects
      operationId: unlinkEnvironmentFromProject
      parameters:
      - $ref: '#/components/parameters/ignore_config_files_err'
      - $ref: '#/components/parameters/skip_hooks'
      responses:
        '200':
          description: 'This status code is returned when some components belonging to the environment use on_delete hooks.

            The hooks have been triggered but the environment still exists.

            Use skip_hooks=true to delete the environment skipping the hooks.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Build'
        '204':
          description: Project environment unlinked successfully
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Unlink environment from project
      x-summary-source: derived
  /organizations/{organization_canonical}/projects/{project_canonical}/favorites:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/project_canonical'
    post:
      description: Add a new project in the user favorites list.
      tags:
      - Organization projects
      operationId: createProjectFavorite
      responses:
        '204':
          description: The project has been added to user favorites list.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Create project favorite
      x-summary-source: derived
    delete:
      description: Remove a project from the user favorites list.
      tags:
      - Organization projects
      operationId: deleteProjectFavorite
      responses:
        '204':
          description: The project has been removed from user favorites list.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete project favorite
      x-summary-source: derived
components:
  schemas:
    LabelSelectorRequirement:
      description: A single label constraint applied to a stack's labels
      title: Label Selector Requirement
      required:
      - key
      - operator
      - values
      properties:
        key:
          type: string
          maxLength: 255
          minLength: 1
        operator:
          description: The matching operator. 'eq' requires the label to carry the single value; 'in' requires the label to carry at least one of the values.
          type: string
          enum:
          - eq
          - in
        values:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 255
            minLength: 1
    ConfigRepositorySyncStatus:
      description: Derived health of a config repository's asynchronous git projection, computed from the pending commit-outbox entries. Surfaced so the UI can tell the user their saved configuration is failing to sync (and is being retried automatically) without implying the configuration was lost.
      type: object
      title: ConfigRepositorySyncStatus
      required:
      - state
      properties:
        last_error:
          description: The most recent sync failure message (present when state is error).
          type: string
        oldest_pending_at:
          description: Unix timestamp in milliseconds of the oldest change still pending projection to git.
          type: integer
          format: uint64
        pending_count:
          description: Number of buffered changes not yet mirrored to git.
          type: integer
          format: uint64
        state:
          description: 'synced: nothing pending, git mirror up to date. syncing: pending entries, no recorded error (normal catch-up). error: pending entries are failing to sync and are being retried.'
          type: string
          enum:
          - synced
          - syncing
          - error
    ServiceCatalogTechnology:
      description: ServiceCatalogTechnology is a Technology of the Service Catalog
      title: ServiceCatalogTechnology
      properties:
        technology:
          type: string
        version:
          type: string
    ServiceCatalog:
      description: Represents the Service Catalog item
      title: Service Catalog
      required:
      - id
      - name
      - canonical
      - author
      - keywords
      - ref
      - form_enabled
      - trusted
      - directory
      - visibility
      - organization_canonical
      - version
      - latest
      properties:
        author:
          type: string
        blueprint:
          description: Determines if given stack is a blueprint
          type: boolean
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        cloud_providers:
          description: Cloud providers supported by the stack
          type: array
          items:
            $ref: '#/components/schemas/CloudProvider'
        created_at:
          type: integer
          format: uint64
        default_version_branch:
          description: Default version of the stack, based on the Catalog Repository branch
          type: string
        dependencies:
          description: 'Canonicals of the stacks that must be instantiated before this one. Read-only: dependencies can only be declared in the stack''s .cycloid.yml source file and are refreshed from it; they cannot be set or changed through the API.'
          type: array
          items:
            type: string
          readOnly: true
        description:
          type: string
        directory:
          description: Directory where the ServiceCatalog configuration is found.
          type: string
        form_enabled:
          description: Indicates if this stack can be configured with form's or not. Based on the presence or not of a valid .forms.yaml file since it's creation or last refresh.
          type: boolean
        id:
          type: integer
          format: uint32
          minimum: 1
        image:
          type: string
          format: uri
        keywords:
          type: array
          items:
            type: string
        labels:
          description: Structured key:value labels declared in the stack's .cycloid.yml
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogLabel'
        latest:
          description: Indicates if the stack uses the latest version
          type: boolean
        name:
          type: string
        organization_canonical:
          description: Organization that the stack belongs to
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        readme:
          description: Readme of the stack
          type: string
        ref:
          type: string
        service_catalog_source_canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        team:
          description: Team that maintains the stack
          $ref: '#/components/schemas/SimpleTeam'
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogTechnology'
        trusted:
          description: If 'true' the ServiceCatalog is from the main organization and can be trusted.
          type: boolean
        unique:
