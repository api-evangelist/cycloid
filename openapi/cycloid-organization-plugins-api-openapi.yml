components:
  schemas:
    PluginWidget:
      description: A widget associated with an installed Plugin
      type: object
      title: Plugin Widget
      required:
      - type
      - placement
      - widget
      - is_default
      properties:
        id:
          type: integer
          format: uint32
          minimum: 1
        is_default:
          description: Whether this is a default widget
          type: boolean
        placement:
          description: 'Placement configuration of the widget. When type is "component", requires "tab_name" in config. When type is "sideMenuPage", requires "title" and "description" in config.

            '
          type: object
        relation:
          $ref: '#/components/schemas/PluginRelation'
        type:
          description: Type of the widget
          type: string
          enum:
          - table
          - iframe
        url_slug:
          description: URL-friendly slug derived from the widget title
          type: string
        widget:
          description: Widget configuration
          type: object
        widget_key:
          description: 'Stable key declared for the widget in the plugin''s widgets.yaml, used to match it across plugin version upgrades. Empty when the widget declares none.

            '
          type: string
    UpdatePluginInstall:
      description: The data needed to update a Plugin Install to a new Plugin Version
      type: object
      title: Update Plugin Install
      required:
      - plugin_version_id
      - configuration
      properties:
        configuration:
          description: Stack Forms syntax configuration
          type: object
          additionalProperties:
            type: string
        plugin_version_id:
          description: ID of the new Plugin Version of the Plugin on the Plugin Registry
          type: integer
          format: uint32
          minimum: 1
        setup:
          description: Optional runtime setup overrides
          type:
          - object
          - 'null'
          properties:
            max_cpu:
              type: string
            max_memory:
              type: string
            max_replicas:
              type: integer
              format: int32
            min_cpu:
              type: string
            min_memory:
              type: string
            min_replicas:
              type: integer
              format: int32
            replicas:
              type: integer
              format: int32
    PluginInstall:
      description: The Plugin Install data
      type: object
      title: Plugin Install
      required:
      - id
      - uuid
      - configuration
      - status
      - pm_secret
      - created_at
      - updated_at
      properties:
        configuration:
          description: Stack Forms syntax configuration
          type: object
          additionalProperties:
            type: string
        created_at:
          type: integer
          format: uint64
        id:
          type: integer
          format: uint32
          minimum: 1
        inherited:
          description: Whether the install is inherited from a parent organization
          type: boolean
        owner_organization_canonical:
          description: Canonical of the organization that owns the plugin install
          type: string
        pm_secret:
          description: Secret used by the frontend to generate webhooks for the Plugin
          type: string
        read_only:
          description: Whether the install is read-only (inherited from parent org)
          type: boolean
        setup:
          description: Per-install runtime setup overrides
          type:
          - object
          - 'null'
          properties:
            max_cpu:
              description: K8s resource limit for CPU
              type: string
            max_memory:
              description: K8s resource limit for memory
              type: string
            max_replicas:
              description: HPA maximum replicas (mutually exclusive with replicas)
              type: integer
              format: int32
            min_cpu:
              description: K8s resource request for CPU
              type: string
            min_memory:
              description: K8s resource request for memory
              type: string
            min_replicas:
              description: HPA minimum replicas (mutually exclusive with replicas)
              type: integer
              format: int32
            replicas:
              description: Static replica count (mutually exclusive with min/max_replicas)
              type: integer
              format: int32
        status:
          description: Status of the Plugin deployment process on Plugin Manager
          type: string
          enum:
          - pending
          - running
          - failed
        updated_at:
          type: integer
          format: uint64
        url_slug:
          description: URL-friendly slug for the plugin install, unique per organization
          type: string
        uuid:
          description: Unique identifier of the Plugin Install
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/PluginVersion'
        visibility:
          description: Visibility scope of the plugin install
          type: string
          enum:
          - local
          - shared
    UpdatePlugin:
      description: The Plugin data needed to update it
      type: object
      title: Update Plugin
      required:
      - name
      properties:
        name:
          description: Name assigned to the Plugin
          type: string
    PluginInstallDeploymentLog:
      description: Plugin Install deployment log entry
      type: object
      title: Plugin Install Deployment Log
      required:
      - timestamp
      - message
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    UpdatePluginRegistry:
      description: The Plugin Registry data needed to update it
      type: object
      title: Update Plugin Registry
      required:
      - name
      properties:
        name:
          description: Name assigned to the Repository
          type: string
    PluginVersionLog:
      description: The Plugin Version Log info
      type: object
      title: PluginVersionLog
      required:
      - id
      - message
      - timestamp
      properties:
        id:
          type: integer
          format: uint32
          minimum: 1
        message:
          description: Text of the log line
          type: string
        timestamp:
          type: string
          format: date-time
    PluginVersion:
      description: The Plugin that holds all the Versions
      type: object
      title: Plugin
      required:
      - id
      - name
      - url
      - status
      properties:
        configuration:
          description: Stack Forms syntax configuration
          type: array
          items:
            type: object
        description:
          description: The Description of the Plugin Version
          type: string
        error:
          description: If an error happen on the creation of the Version this will hold the info
          type: string
        icon:
          description: Icon of the Plugin Version
          type: string
          format: uri
        id:
          type: integer
          format: uint32
          minimum: 1
        images:
          description: Images to show the Plugin Version
          type: array
          items:
            type: string
            format: uri
        name:
          description: Name assigned to the Plugin
          type: string
        schema:
          description: Schema of the SQLite schema
          type: object
        scope:
          description: Policies in which the Plugin Version is scoped
          type: array
          items:
            type: string
        setup:
          description: Runtime setup declared in the plugin manifest
          type: object
          properties:
            max_cpu:
              description: K8s resource limit for CPU
              type: string
            max_memory:
              description: K8s resource limit for memory
              type: string
            min_cpu:
              description: K8s resource request for CPU
              type: string
            min_memory:
              description: K8s resource request for memory
              type: string
            readiness_path:
              description: HTTP path for K8s readiness probe
              type: string
        status:
          description: Status of the current Plugin Version creation process
          type: string
          enum:
          - pending
          - processing
          - failed
          - success
        url:
          description: URL of the Plugin Version
          type: string
          format: uri
        widgets:
          description: List of default Widgets configuration
          type: array
          items:
            type: object
    Pagination:
      type: object
      title: Pagination
      required:
      - total
      - index
      - size
      properties:
        index:
          description: The index of the page sent (the first page is 1).
          type: integer
          format: uint64
          minimum: 1
        size:
          description: The size of the page (the number of entities per page)
          type: integer
          format: uint64
        total:
          description: The total number of items.
          type: integer
          format: uint64
    NewPluginInstall:
      description: The data needed to create a Plugin Install
      type: object
      title: New Plugin Install
      required:
      - configuration
      properties:
        configuration:
          description: Stack Forms syntax configuration
          type: object
          additionalProperties:
            type: string
        setup:
          description: Optional runtime setup overrides
          type:
          - object
          - 'null'
          properties:
            max_cpu:
              type: string
            max_memory:
              type: string
            max_replicas:
              type: integer
              format: int32
            min_cpu:
              type: string
            min_memory:
              type: string
            min_replicas:
              type: integer
              format: int32
            replicas:
              type: integer
              format: int32
    PluginRelation:
      description: The relation between a Plugin and a Component
      type: object
      title: Plugin Relation
      required:
      - relations
      - enabled
      properties:
        enabled:
          description: If the Plugin is enabled for the Component
          type: boolean
        relations:
          description: List of relations between a Plugin and a Component
          type: object
    PluginWidgetView:
      description: A resolved widget view for a plugin install
      type: object
      title: Plugin Widget View
      required:
      - id
      - enabled
      - url_slug
      - effective_enabled
      - effective_slug
      - widget
      properties:
        effective_enabled:
          description: The effective enabled state after inheritance resolution
          type: boolean
        effective_slug:
          description: The effective URL slug after inheritance resolution
          type: string
        enabled:
          description: Whether this widget view is enabled
          type: boolean
        has_override:
          description: Whether a child-org override exists
          type: boolean
        id:
          type: integer
          format: uint32
          minimum: 1
        is_inherited:
          description: Whether the view is inherited from a parent organization
          type: boolean
        url_slug:
          description: URL slug for the widget view
          type: string
        widget:
          $ref: '#/components/schemas/PluginWidget'
    PluginRegistry:
      description: The Plugin Registry that holds all the available Plugins
      type: object
      title: Plugin Registry
      required:
      - id
      - name
      - url
      - access
      - status
      - created_at
      - updated_at
      properties:
        access:
          description: If you have access to create Plugins
          type: boolean
        created_at:
