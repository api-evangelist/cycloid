                    type: array
                    items:
                      $ref: '#/components/schemas/PluginRegistry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - access: false
                  created_at: 1503225026
                  id: 1
                  name: PR1
                  status: connected
                  updated_at: 1503335026
                  url: http://pr1.com
                - access: true
                  created_at: 1503225026
                  id: 2
                  name: PR2
                  status: offline
                  updated_at: 1503335026
                  url: http://pr2.com
                pagination:
                  index: 1
                  size: 10
                  total: 2
