          description: Plugin created.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Plugin'
              example:
                data:
                  id: 1
                  latest:
                    configuration:
                    - default: hello world and especially to you <3
                      description: Message to display in the job
                      key: message
                      name: Message
                      type: string
                      widget: simple_text
                    description: Test description plugin
                    icon: https://placehold.co/50x50
                    id: 1
                    images:
                    - https://placehold.co/600x400
                    - https://placehold.co/600x400
                    name: P1
                    schema:
                      driver:
                        database_version: 3.50.4
                        name: sqlite
                      name: Plugins
                      relations:
                      - columns:
                        - author_id
                        def: FOREIGN KEY (author_id) REFERENCES authors (id) ON UPDATE NO ACTION ON DELETE CASCADE MATCH NONE
                        parent_columns:
                        - id
                        parent_table: authors
                        table: quoates
                      tables:
                      - columns:
                        - name: id
                          type:
                          - INTEGER
                          - 'null'
                        - name: name
                          type:
                          - TEXT
                          - 'null'
                        constraints:
                        - columns:
                          - id
                          def: PRIMARY KEY (id)
                          name: id
                          table: authors
                          type: PRIMARY KEY
                        def: "CREATE TABLE authors (\n\t\tid INTEGER PRIMARY KEY,\n\t\tname TEXT\n)"
                        name: authors
                        type: table
                      - columns:
                        - name: id
                          type:
                          - INTEGER
                          - 'null'
                        - name: message
                          type:
                          - TEXT
                          - 'null'
                        - name: author_id
                          type: INT UNSIGNED
                        constraints:
                        - columns:
                          - id
                          def: PRIMARY KEY (id)
                          name: id
                          table: quotes
                          type: PRIMARY KEY
                        - columns:
                          - author_id
                          def: FOREIGN KEY (author_id) REFERENCES authors (id) ON UPDATE NO ACTION ON DELETE CASCADE MATCH NONE
                          name: '- (Foreign key ID: 0)'
                          referenced_columns:
                          - id
                          referenced_table: authors
                          table: quotes
                          type: FOREIGN KEY
                        def: "CREATE TABLE quotes (\n\t\tid INTEGER PRIMARY KEY,\n\t\tmessage TEXT,\n\t\tauthor_id INT UNSIGNED NOT NULL,\n\n\n\t\tCONSTRAINT fk__quotes__authors\n\t\t\tFOREIGN KEY (author_id) REFERENCES authors (id)\n\t\t\tON DELETE CASCADE\n)"
                        name: quotes
                        type: table
                    scope:
                    - organization:credential:list
                    - organization:project:list
                    status: success
                    url: dregistry:5000/cycloid/cy-go-plugin:0.0.1
                    widgets:
                    - placement:
                        config:
                          tab_name: Quotes
                        type: component
                      type: table
                      widget:
                        columns:
                        - title: Message
                          type: string
                          value: message
                        - title: Author
                          type: string
                          value: author
                        query: select q.message, a.name from quotes as q join authors as a on q.author_id = a.id
                  name: P1
                  registry:
                    access: false
                    created_at: 1503225026
                    id: 1
                    name: PR1
                    status: connected
                    updated_at: 1503335026
                    url: http://pr1.com
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '411':
          $ref: '#/components/responses/required_content_length_header'
