      - muted
      - created_at
      - updated_at
      - filters
      - organization_canonical
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        created_at:
          type: integer
          format: uint64
        filters:
          type: array
          items:
            $ref: '#/components/schemas/WatchRuleFilter'
        id:
          type: integer
          format: uint32
          minimum: 1
        muted:
          type: boolean
        name:
          type: string
          minLength: 2
        organization_canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        project_canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        updated_at:
          type: integer
          format: uint64
