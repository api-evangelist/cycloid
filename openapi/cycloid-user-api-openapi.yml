openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! User API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- description: Operations for the authenticated user.
  name: User
paths:
  /user:
    get:
      description: Get the information of the account of the authenticated user.
      tags:
      - User
      operationId: getUserAccount
      responses:
        '200':
          description: The user account information.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserAccount'
              example:
                data:
                  country:
                    code: GB
                    name: United Kingdom
                  created_at: 1503225026
                  emails:
                  - email: mariano@jimenez.com
                    purpose: primary
                    verified: true
                  full_name: Mariano Jimenez
                  guide:
                    presentation: false
                    tutorial:
                      configEnv: false
                      createProject: false
                      credentials: false
                      customEnvConfig: false
                      deployed: false
                      finish: false
                      letsgo: false
                      reviewDeploy: false
                      selectStack: false
                      tasksDetails: false
                      welcome: false
                  last_login: 1503413020
                  locale: en
                  picture_url: https://avatars2.githubusercontent.com/u/14579210
                  updated_at: 1503335026
                  username: user-1
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get user account
      x-summary-source: derived
    put:
      description: Update the information of the account of the authenticated user.
      tags:
      - User
      operationId: updateUserAccount
      responses:
        '200':
          description: The updated user profile information.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserAccount'
              example:
                data:
                  country_code: UK
                  created_at: 1503225026
                  emails:
                  - email: mariano@jimenez.com
                    purpose: primary
                    verified: true
                  full_name: Mariano Jimenez
                  last_login: 1503413020
                  locale: en
                  picture_url: https://avatars2.githubusercontent.com/u/14579210
                  updated_at: 1503335026
                  username: user-1
        '409':
          description: Trying setting an unverified email as the primary
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        '503':
          $ref: '#/components/responses/retry_operation'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateUserAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUserAccount'
        description: The user content
        required: true
      summary: Update user account
      x-summary-source: derived
    post:
      security: []
      description: Create a new User (sign-up).
      tags:
      - User
      operationId: signUp
      responses:
        '200':
          description: Account created. The response specifies whether the user is already verified or not. If verified, the response contains a login token allowing to access the dashboard without having to verify the account. If not verified, the account MUST be verified through the link sent to the email address.
          content:
            application/json:
              schema:
                type: object
                required:
                - verified
                properties:
                  session:
                    $ref: '#/components/schemas/UserSession'
                  verified:
                    description: Specifies whether the user is already verified.
                    type: boolean
              example:
                verified: false
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewUserAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewUserAccount'
        description: The user content
        required: true
      summary: Sign up
      x-summary-source: derived
    delete:
      description: The authenticated user delete itself from the system.
      tags:
      - User
      operationId: deleteUserAccount
      responses:
        '204':
          description: User account has been deleted.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete user account
      x-summary-source: derived
  /user/aws_marketplace:
    post:
      security: []
      description: Create a new AWS Marketplace User.
      tags:
      - User
      operationId: signUpAWSMarketplace
      responses:
        '204':
          description: Account created. The account MUST be verified through the link sent to the email address.
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewAWSMarketplaceUserAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewAWSMarketplaceUserAccount'
        description: The user content
        required: true
      summary: Sign up AWS marketplace
      x-summary-source: derived
  /user/aws_marketplace/entitlement:
    post:
      security: []
      description: 'This endpoint handles redirections from AWS Marketplace to our system.

        If user doesn''t exist, he''ll be redirected to registration page.

        If user exist, he''ll be redirected to login page.'
      tags:
      - User
      operationId: handleAWSMarketplaceUserEntitlement
      responses:
        '301':
          description: The user is redirected based on his account state.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Handle AWS marketplace user entitlement
      x-summary-source: derived
  /user/email/authentication/{authentication_token}:
    put:
      security: []
      description: Verify that the email address is own by the user.
      tags:
      - User
      operationId: emailAuthenticationVerification
      parameters:
      - $ref: '#/components/parameters/authentication_token'
      responses:
        '200':
          description: The token which represents the session of the user.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSession'
              example:
                data:
                  owns:
                  - organization:seraf:team:teamcan
                  permissions:
                    organization:team:create:
                      action: organization:team:read
                      effect: allow
                      id: 21
                      resources:
                      - organization:org-can:team:team-can
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImY0YjdiZjZlLTE1NmYtNDYxMy05NmFiLWIwMzg5NzdiMWRkMSJ9..v6BuWwO6vN6PNW9d-Eqdoy7GHfUXKQ7byRbqwKRwHlA
        '401':
          $ref: '#/components/responses/unauthenticated'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Email authentication verification
      x-summary-source: derived
  /user/email/verification:
    post:
      security: []
      description: Re-send the verification user's email to the indicated address.
      tags:
      - User
      operationId: emailVerificationResend
      responses:
        '204':
          description: The email verification has been re-sent.
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UserEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserEmail'
        description: The email address to re-send the verification email. This endpoint doesn't return any error status code if the email doesn't exist nor it's already verified for avoiding that an attacker could find registered users email address.
        required: true
      summary: Email verification resend
      x-summary-source: derived
  /user/email/verification/{verification_token}:
    put:
      security: []
      description: Verify that the email address is own by the user.
      tags:
      - User
      operationId: emailVerification
      parameters:
      - $ref: '#/components/parameters/verification_token'
      responses:
        '204':
          description: Email address has been verified.
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Email verification
      x-summary-source: derived
  /user/guide:
    put:
      security: []
      description: Update user's guide progress.
      tags:
      - User
      operationId: updateUserGuide
      responses:
        '204':
          description: The guide progress has been updated.
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UserGuide'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserGuide'
        description: The guide's progress JSON schema
      summary: Update user guide
      x-summary-source: derived
  /user/impersonate:
    post:
      description: Start a support impersonation session (ENG-407). The caller is authenticated with their own JWT and their primary email must be on the root organization impersonation allowlist. The returned session JWT has the target user as its subject, scoped to the given organization or to none when the organization is omitted (the client then refreshes into one of the target's organizations, as after a plain login), and carries an 'impersonator' claim naming the caller so every request stays attributable. It expires after the configured impersonation TTL and a refresh never extends it.
      tags:
      - User
      operationId: impersonateUser
      responses:
        '200':
          description: The token which represents the impersonated session.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSession'
        '401':
          $ref: '#/components/responses/unauthenticated'
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UserImpersonate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserImpersonate'
        description: The user to impersonate and the organization to scope the session to.
        required: true
      summary: Impersonate user
      x-summary-source: derived
  /user/impersonate/stop:
    post:
      description: 'End an impersonation session (ENG-407). Must be called with the impersonated JWT. The session is revoked: the impersonated JWT, and every JWT a refresh derived from it, are refused from then on, and the stop is logged next to the start.'
      tags:
      - User
      operationId: stopImpersonateUser
      responses:
        '204':
          description: The impersonation session has been ended.
        '401':
          $ref: '#/components/responses/unauthenticated'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Stop impersonate user
      x-summary-source: derived
  /user/login:
    post:
      security: []
      description: Authenticate a user and return a new JWT token.
      tags:
      - User
      operationId: login
      responses:
        '200':
          description: The token which represents the session of the user.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSession'
              example:
                data:
                  owns:
                  - organization:seraf:team:teamcan
                  permissions:
                    organization:team:create:
                      action: organization:team:read
                      effect: allow
                      id: 21
                      resources:
                      - organization:org-can:team:team-can
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImY0YjdiZjZlLTE1NmYtNDYxMy05NmFiLWIwMzg5NzdiMWRkMSJ9..v6BuWwO6vN6PNW9d-Eqdoy7GHfUXKQ7byRbqwKRwHlA
        '401':
          $ref: '#/components/responses/unauthenticated'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UserLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLogin'
        description: The user content
        required: true
      summary: Login
      x-summary-source: derived
  /user/login/{organization_canonical}:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    post:
      security: []
      description: Authenticate a user and return a new JWT token.
      tags:
      - User
      operationId: loginToOrg
      responses:
        '200':
          description: The token which represents the session of the user.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSession'
              example:
                data:
                  owns:
                  - organization:seraf:team:teamcan
                  permissions:
                    organization:team:create:
                      action: organization:team:read
                      effect: allow
                      id: 21
                      resources:
                      - organization:org-can:team:team-can
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImY0YjdiZjZlLTE1NmYtNDYxMy05NmFiLWIwMzg5NzdiMWRkMSJ9..v6BuWwO6vN6PNW9d-Eqdoy7GHfUXKQ7byRbqwKRwHlA
        '401':
          $ref: '#/components/responses/unauthenticated'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UserLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLogin'
        description: The user content
        required: true
      summary: Login to org
      x-summary-source: derived
  /user/logout:
    post:
      description: End the session of the JWT used to call it. The JWT, and every JWT a refresh derived from it, are refused from then on.
      tags:
      - User
      operationId: logout
      responses:
        '204':
          description: The session has been ended.
        '401':
          $ref: '#/components/responses/unauthenticated'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Logout
      x-summary-source: derived
  /user/notification_settings:
    get:
      security: []
      description: Get the notification settings for the user.
      tags:
      - User
      operationId: getNotificationSettings
      responses:
        '200':
          description: The notification settings of the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
              example:
                data:
                  watch_projects_on_create: true
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get notification settings
      x-summary-source: derived
    post:
      security: []
      description: A user's notification settings.
      tags:
      - User
      operationId: updateNotificationSettings
      responses:
        '204':
          description: The notification settings were updated
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
        description: Desired notification settings
        required: true
      summary: Update notification settings
      x-summary-source: derived
  /user/notifications:
    get:
      security: []
      description: List all the notifications for the user.
      tags:
      - User
      operationId: listNotifications
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/order_by_query'
      responses:
        '200':
          description: The notifications for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
              example:
              - created_at: 1503225026
                event:
                  icon: fa-check-circle
                  id: 123
                  message: The build deploy-app#42 of pipeline my-project-prod has completed successfully
                  severity: info
                  tags:
                  - key: action
                    value: complete
                  - key: entity
                    value: build
                  timestamp: 1503225026000
                  title: Pipeline build completed
                  type: Cycloid
                id: 42
                read_at: 1503340000
                updated_at: 1503335026
                watch_rule_canonical: watch-my-project
              - created_at: 1503225100
                event:
                  icon: fa-info-circle
                  id: 124
                  message: A new AWS EC2 instance was detected in the production environment
                  severity: info
                  tags:
                  - key: environment
                    value: production
                  timestamp: 1503225100000
                  title: New infrastructure resource detected
                  type: Cycloid
                id: 43
                updated_at: 1503335100
                watch_rule_canonical: watch-infrastructure
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: List notifications
      x-summary-source: derived
    delete:
      security: []
      description: Delete all the notifications for the user at once.
      tags:
      - User
      operationId: deleteAllNotifications
      responses:
        '204':
          description: Deletion succeeded, no further information available
        '403':
          $ref: '#/components/responses/unauthenticated'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete all notifications
      x-summary-source: derived
  /user/notifications/read_all:
    post:
      security: []
      description: Mark the all notification as read for the user.
      tags:
      - User
      operationId: markAllNotificationAsRead
      responses:
        '200':
          description: The notifications was marked as read
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Mark all notification as read
      x-summary-source: derived
  /user/notifications/{notification_id}:
    parameters:
    - $ref: '#/components/parameters/notification_id'
    get:
      security: []
      description: Get the notification for the user.
      tags:
      - User
      operationId: getNotification
      responses:
        '200':
          description: The notification for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                created_at: 1503225026
                event:
                  icon: fa-check-circle
                  id: 123
                  message: The build deploy-app#42 of pipeline my-project-prod has completed successfully
                  severity: info
                  tags:
                  - key: action
                    value: complete
                  - key: entity
                    value: build
                  - key: project_canonical
                    value: my-project
                  timestamp: 1503225026000
                  title: Pipeline build completed
                  type: Cycloid
                id: 42
                read_at: 1503340000
                updated_at: 1503335026
                watch_rule_canonical: watch-my-project
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get notification
      x-summary-source: derived
    delete:
      security: []
      description: Delete the notification for the user.
      tags:
      - User
      operationId: deleteNotification
      responses:
        '204':
          description: The notification was deleted
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete notification
      x-summary-source: derived
  /user/notifications/{notification_id}/read:
    parameters:
    - $ref: '#/components/parameters/notification_id'
    post:
      security: []
      description: Mark the notification as read for the user.
      tags:
      - User
      operationId: markNotificationAsRead
      responses:
        '200':
          description: The notification was marked as read
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Mark notification as read
      x-summary-source: derived
  /user/notifications/{notification_id}/unread:
    parameters:
    - $ref: '#/components/parameters/notification_id'
    post:
      security: []
      description: Mark the notification as unread for the user.
      tags:
      - User
      operationId: markNotificationAsUnread
      responses:
        '200':
          description: The notification was marked as unread
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Mark notification as unread
      x-summary-source: derived
  /user/refresh_token:
    parameters:
    - $ref: '#/components/parameters/organization_canonical_query'
    - $ref: '#/components/parameters/child_canonical_query'
    get:
      description: 'Refresh the user JWT and returns a new one if the previous is valid. The ''organization_canonical_query'' has to be of an organization in which the user belongs to, and the ''child_canonical_query'' of a child of the ''organization_canonical_query'' in any level (could be of a grand child). When only ''child_canonical_query'' is provided (without ''organization_canonical_query''), the backend will resolve the parent automatically: if the user is a direct member of the child org, a normal JWT is returned; otherwise, the ancestry chain is walked to find a parent org the user belongs to, and a child JWT is returned.'
      tags:
      - User
      operationId: refreshToken
      responses:
        '200':
          description: The token which represents the session of the user.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSession'
              example:
                data:
                  owns:
                  - organization:seraf:team:teamcan
                  permissions:
                    organization:team:create:
                      action: organization:team:read
                      effect: allow
                      id: 21
                      resources:
                      - organization:org-can:team:team-can
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImY0YjdiZjZlLTE1NmYtNDYxMy05NmFiLWIwMzg5NzdiMWRkMSJ9..CHA3146UEHwVW6nYkDgYeSukGeZIH55mi4O0LsemenA
        '401':
          $ref: '#/components/responses/unauthenticated'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Refresh token
      x-summary-source: derived
  /user/reset_password:
    put:
      security: []
      description: Reset the user password when it has been forgotten. Due to security reasons, the endpoint doesn't return a Unprocessable Entity (422) when the token is invalid. 404 Status code is returned if the user has been deleted of the system between the user password request and this request.
      tags:
      - User
      operationId: passwordResetUpdate
      responses:
        '204':
          description: The password has been changed.
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UserPasswordResetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserPasswordResetUpdate'
        description: The reset password payload
        required: true
      summary: Password reset update
      x-summary-source: derived
    post:
      security: []
      description: Request to reset the password. Due to security reasons, this endpoint doesn't return Not Found (404) when the email doesn't exist or belongs to a user primary email.
      tags:
      - User
