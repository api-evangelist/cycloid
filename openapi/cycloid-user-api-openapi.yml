components:
  schemas:
    NewWatchRuleFilter:
      description: The entity which represents the information of an Watch rule filter
      type: object
      title: New Watch rule filter
      required:
      - operation
      - entity
      properties:
        entity:
          description: '* means the filter is applied to all the entities'
          type: string
        operation:
          description: '* means the filter is applied to all the operations'
          type: string
    NewOAuthUser:
      description: The User OAuth information
      title: User's OAuth information
      required:
      - email
      - full_name
      - social_id
      properties:
        country_code:
          description: Code of a country the user is from in alpha-2 format
          type: string
          pattern: ^[A-Z]{2}$
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 255
          minLength: 2
        invitation_token:
          description: The field is used when a user signup from an invitation to an organization. Giving the token, the created user will be automatically added to the organization.
          type: string
          minLength: 5
        locale:
          description: User's preferred language
          type: string
          enum:
          - en
          - fr
          - es
        organization_canonical:
          type: string
        picture_url:
          type: string
          format: uri
        social_id:
          type: string
        username:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    UserPasswordResetReq:
      description: Request to send a token for allowing the user to reset its current password.
      title: User password reset request
      required:
      - email
      properties:
        email:
          description: the email address must be the primary email of the user.
          type: string
          format: email
    WatchRule:
      description: The entity which represents the information of a Watch rule
      type: object
      title: Watch rule
      required:
      - id
      - canonical
