      - canonical
      - name
      - created_at
      - updated_at
      - service_catalog
      - environment
      - project
      - version
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[\da-zA-Z]+(?:(?:[\da-zA-Z\-._]+)?[\da-zA-Z])?$
