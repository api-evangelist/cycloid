openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Organization Credentials API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- name: Organization Credentials
paths:
  /organizations/{organization_canonical}/credentials:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    get:
      description: Return all the Credentials, depending on the caller permissions it'll return the Raw data or not. If the caller has List and not Get it'll not return the Raw, if it has List and Read it'll return the Raw.
      tags:
      - Organization Credentials
      operationId: listCredentials
      parameters:
      - $ref: '#/components/parameters/page_index'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/credential_type_query'
      - $ref: '#/components/parameters/credential_types_query'
      responses:
        '200':
          description: List of the Credentials
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialSimple'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                data:
                - canonical: name-key1
                  created_at: 1503225026
                  id: 1
                  name: name-key
                  owner:
                    created_at: 1503225026
                    email: mariana.jimenezo@fakeemail.com
                    full_name: Mariana Jimenezo
                    id: 10
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: this is the standard role
                      id: 42
                      name: standard role
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-2
                  path: my/path
                  raw:
                    ssh_key: key
                  type: ssh
                  updated_at: 1503335026
                - canonical: name-key2
                  created_at: 1503225026
                  id: 2
                  name: name-key
                  owner:
                    created_at: 1503225026
                    email: mariana.jimenezo@fakeemail.com
                    full_name: Mariana Jimenezo
                    id: 10
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: this is the standard role
                      id: 42
                      name: standard role
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-2
                  path: my/path
                  raw:
                    ssh_key: key
                  type: ssh
                  updated_at: 1503335026
                pagination:
                  index: 1
                  size: 10
                  total: 2
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: List credentials
      x-summary-source: derived
    post:
      description: 'Create a new Credential, based on the type you will have to pass different parameters within the body:

        * ssh: ssh_key

        * aws: access_key, secret_key

        * gcp: json_key

        * azure: client_id, client_secret, subscription_id, tenant_id

        * azure_storage: account_name, access_key

        * basic_auth: username, password

        * elasticsearch: username, password, ca_cert

        * swift: auth_url, username, password, domain_id, tenant_id

        * vmware: username, password'
      tags:
      - Organization Credentials
      operationId: createCredential
      responses:
        '200':
          description: Credential created. The body contains the information of the new created Credential.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
              example:
                data:
                  canonical: name-key
                  id: 2
                  name: name-key
                  path: my/path
                  raw:
                    ssh_key: key
                  type: ssh
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/NewCredential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewCredential'
        description: The information of the organization to create.
        required: true
      summary: Create credential
      x-summary-source: derived
  /organizations/{organization_canonical}/credentials/options:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/credential_options_service_query'
    post:
      description: Get options for a Credential without storing it. This endpoint accepts credential details in the request body and returns service-specific options. Useful for validating or exploring credential capabilities before creating it.
      tags:
      - Organization Credentials
      operationId: getCredentialOptionsBare
      responses:
        '200':
          description: Service-specific options for the Credential
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: The credential options. The shape of the items could be anything,  since each service can have very different options.
              example:
                data:
                  projects:
                  - datasets:
                    - id: all_billing_data
                      tables:
                      - id: cloud_pricing_export
                      - id: gcp_billing_export_resource_v1_GOOGLE_CLOUD_ACCOUNT_ID
                      - id: gcp_billing_export_v1_GOOGLE_CLOUD_ACCOUNT_ID
                    id: cycloid-xxx
                  - datasets: null
                    id: cycloid-demo
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/BareCredential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BareCredential'
        description: The credential to get options for.
        required: true
      summary: Get credential options bare
      x-summary-source: derived
  /organizations/{organization_canonical}/credentials/{credential_canonical}:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/credential_canonical'
    get:
      description: Get the information of the Credential.
      tags:
      - Organization Credentials
      operationId: getCredential
      responses:
        '200':
          description: The information of the Credential which has the specified ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
              example:
                data:
                  canonical: name-key
                  id: 2
                  name: name-key
                  owner:
                    created_at: 1503225026
                    email: mariana.jimenezo@fakeemail.com
                    full_name: Mariana Jimenezo
                    id: 10
                    picture_url: https://avatars2.githubusercontent.com/u/14579210
                    role:
                      canonical: role-can
                      description: this is the standard role
                      id: 42
                      name: standard role
                      rules:
                      - action: organization:delete
                        effect: allow
                        id: 1
                        resources:
                        - organization:org-can
                        - organization:org-can2
                      - action: organization:team:create
                        effect: allow
                        id: 20
                        resources: null
                      - action: organization:team:read
                        effect: allow
                        id: 21
                        resources:
                        - organization:org-can:team:team-can
                    username: user-2
                  path: my/path
                  raw:
                    ssh_key: key
                  type: ssh
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get credential
      x-summary-source: derived
    put:
      description: 'Update an existing Credential, based on the type you will have to pass different parameters within the body:

        * ssh: ssh_key

        * aws: access_key, secret_key

        * gcp: json_key

        * azure: client_id, client_secret, subscription_id, tenant_id

        * azure_storage: account_name, access_key

        * basic_auth: username, password

        * elasticsearch: username, password, ca_cert

        * swift: auth_url, username, password, domain_id, tenant_id

        * vmware: username, password'
      tags:
      - Organization Credentials
      operationId: updateCredential
      responses:
        '200':
          description: Credential updated.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Credential'
              example:
                data:
                  canonical: name-key
                  id: 2
                  name: name-key
                  path: my/path
                  raw:
                    ssh_key: key
                  type: ssh
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '411':
          $ref: '#/components/responses/required_content_length_header'
        '422':
          $ref: '#/components/responses/unprocessable_entity'
        default:
          $ref: '#/components/responses/unexpected_error'
      requestBody:
        content:
          application/vnd.cycloid.io.v1+json:
            schema:
              $ref: '#/components/schemas/UpdateCredential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateCredential'
        description: The information of the organization to update.
        required: true
      summary: Update credential
      x-summary-source: derived
    delete:
      description: Delete the Credential.
      tags:
      - Organization Credentials
      operationId: deleteCredential
      responses:
        '204':
          description: Credential has been deleted.
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        '409':
          description: Credential deletion has internal conflict
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Delete credential
      x-summary-source: derived
  /organizations/{organization_canonical}/credentials/{credential_canonical}/options:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/credential_canonical'
    - $ref: '#/components/parameters/credential_options_service_query'
    get:
      description: Get options of the Credential.
      tags:
      - Organization Credentials
      operationId: getCredentialOptions
      responses:
        '200':
          description: Service-specific options for the Credential with the specified ID.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: The credential options. The shape of the items could be anything,  since each service can have very different options.
              example:
                data:
                  projects:
                  - datasets:
                    - id: all_billing_data
                      tables:
                      - id: cloud_pricing_export
                      - id: gcp_billing_export_resource_v1_GOOGLE_CLOUD_ACCOUNT_ID
                      - id: gcp_billing_export_v1_GOOGLE_CLOUD_ACCOUNT_ID
                    id: cycloid-xxx
                  - datasets: null
                    id: cycloid-demo
        '403':
          $ref: '#/components/responses/not_enough_permissions'
        '404':
          $ref: '#/components/responses/not_found_entity_in_path'
        default:
          $ref: '#/components/responses/unexpected_error'
      summary: Get credential options
      x-summary-source: derived
components:
  parameters:
    credential_canonical:
      description: A Credential canonical
      name: credential_canonical
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 2
        pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    credential_options_service_query:
      name: service
      in: query
      required: true
      schema:
        type: string
        enum:
        - gcp_bigquery
    credential_type_query:
      description: 'Deprecated. Please use credential_types.

        A Credential type

        '
      name: credential_type
      in: query
      schema:
        type: string
        enum:
        - ssh
        - aws
        - custom
        - azure
        - azure_storage
        - gcp
        - basic_auth
        - elasticsearch
        - swift
    organization_canonical:
      description: A canonical of an organization.
      name: organization_canonical
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
        minLength: 2
        pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    page_size:
      description: The number of items at most which the response can have.
      name: page_size
      in: query
      schema:
        type: integer
        format: uint32
        default: 100
    credential_types_query:
      description: Multiple Credential types
      name: credential_types
      in: query
      allowEmptyValue: true
      style: form
      explode: true
      schema:
        type: array
        items:
          enum:
          - ssh
          - aws
          - custom
          - azure
          - azure_storage
          - gcp
          - basic_auth
          - elasticsearch
          - swift
          type: string
        uniqueItems: true
    page_index:
      description: The page number to request. The first page is 1.
      name: page_index
      in: query
      schema:
        type: integer
        format: uint32
        default: 1
  schemas:
    InUseComponent:
      description: Represents a component that's using credential
      title: InUseComponent
      required:
      - canonical
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: (^[a-z0-9]+(([a-z0-9\-_]+)?[a-z0-9]+)?$)
    InUseEnvironment:
      description: Represents an environment that's using credential
      title: InUseEnvironment
      required:
      - canonical
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: (^[a-z0-9]+(([a-z0-9\-_]+)?[a-z0-9]+)?$)
    InUseProject:
      description: Represents a project that's using credential
      title: InUseProject
      required:
      - name
      - canonical
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 1
          pattern: (^[a-z0-9]+(([a-z0-9\-_]+)?[a-z0-9]+)?$)
        name:
          type: string
    NewCredential:
      description: Represents the Credential
      title: Credential
      required:
      - name
      - type
      - raw
      - path
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        description:
          type: string
        name:
          type: string
        owner:
          description: 'User canonical that owns this credential. If omitted then the person creating this

            credential will be assigned as owner. When a user is the owner of a credential he has

            all the permissions on it.

            '
          type: string
        path:
          type: string
          pattern: '[a-zA-z0-9_\-./]'
        raw:
          $ref: '#/components/schemas/CredentialRaw'
        type:
          type: string
          enum:
          - ssh
          - aws
          - custom
          - azure
          - azure_storage
          - gcp
          - basic_auth
          - elasticsearch
          - swift
          - vmware
    Pagination:
      type: object
      title: Pagination
      required:
      - total
      - index
      - size
      properties:
        index:
          description: The index of the page sent (the first page is 1).
          type: integer
          format: uint64
          minimum: 1
        size:
          description: The size of the page (the number of entities per page)
          type: integer
          format: uint64
        total:
          description: The total number of items.
          type: integer
          format: uint64
    Credential:
      description: Represents the Credential
      title: Credential
      required:
      - id
      - canonical
      - name
      - type
      - raw
      - path
      - keys
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        created_at:
          type: integer
          format: uint64
        description:
          type: string
        id:
          type: integer
          format: uint32
          minimum: 1
        in_use:
          $ref: '#/components/schemas/CredentialInUse'
        keys:
          description: List of all the keys available for the Credential
          type: array
          items:
            type: string
        name:
          type: string
        owner:
          description: 'Organization member that owns this credential. When a user is the owner of a

            credential he has all the permissions on it.

            In the event where the user has been deleted that field might be empty.

            '
          $ref: '#/components/schemas/User'
        path:
          type: string
        raw:
          $ref: '#/components/schemas/CredentialRaw'
        type:
          type: string
          enum:
          - ssh
          - aws
          - custom
          - azure
          - azure_storage
          - gcp
          - basic_auth
          - elasticsearch
          - swift
          - vmware
        updated_at:
          type: integer
          format: uint64
    InUseConfigRepository:
      description: Represents a Config repository that's using credential
      title: InUseConfigRepository
      required:
      - name
      - canonical
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        name:
          type: string
    BareCredential:
      description: Represents a minimal credential for options lookup without requiring all fields
      title: Bare Credential
      required:
      - type
      - raw
      properties:
        canonical:
          description: Optional canonical identifier
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        description:
          description: Optional description of the credential
          type: string
        name:
          description: Optional credential name for context
          type: string
        path:
          description: Optional path for the credential
          type: string
          pattern: '[a-zA-z0-9_\-./]'
        raw:
          $ref: '#/components/schemas/CredentialRaw'
        type:
          type: string
          enum:
          - ssh
          - aws
          - custom
          - azure
          - azure_storage
          - gcp
          - basic_auth
          - elasticsearch
          - swift
          - vmware
    User:
      description: A summary of a user to be used in places where only the basic information are need or are enough.
      type: object
      title: Basic info of a user
      required:
      - id
      - username
      - full_name
      - email
      - locale
      - created_at
      - mfa_enabled
      properties:
        country_code:
          description: Code of a country the user is from in alpha-2 format
          type: string
          pattern: ^[A-Z]{2}$
        created_at:
          description: When the user became a member.
          type: integer
          format: uint64
        email:
          description: User's primary email.
          type: string
          format: email
        full_name:
          type: string
        id:
          type: integer
          format: uint32
          minimum: 1
        last_login_at:
          description: When the user logged in last time.
          type: integer
          format: uint64
        locale:
          description: The local that the user prefer.
          type: string
          pattern: ^[a-z]{2}(?:-[a-z][a-z])?$
        mfa_enabled:
          type: boolean
        picture_url:
          type: string
          format: uri
        updated_at:
          description: When the user had the role modified.
          type: integer
          format: uint64
        username:
          type: string
          maxLength: 30
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
    CredentialSimple:
      description: Represents the Credential without the raw and owner
      title: Credential Simple
      required:
      - id
      - name
      - canonical
      - type
      - path
      - keys
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        created_at:
          type: integer
          format: uint64
        description:
          type: string
        id:
          type: integer
          format: uint32
          minimum: 1
        in_use:
          $ref: '#/components/schemas/CredentialInUse'
        keys:
          description: List of all the keys available for the Credential
          type: array
          items:
            type: string
        name:
          type: string
        owner:
          description: 'Organization member that owns this credential. When a user is the owner of a

            credential he has all the permissions on it.

            In the event where the user has been deleted that field might be empty.

            '
          $ref: '#/components/schemas/User'
        path:
          type: string
        type:
          type: string
          enum:
          - ssh
          - aws
          - custom
          - azure
          - azure_storage
          - gcp
          - basic_auth
          - elasticsearch
          - swift
          - vmware
        updated_at:
          type: integer
          format: uint64
    CredentialInUse:
      description: 'InUse represents the resources that are using provided credential.

        '
      type: object
      title: Credential in use
      properties:
        config_repositories:
          type: array
          items:
            $ref: '#/components/schemas/InUseConfigRepository'
        external_backends:
          type: array
          items:
            $ref: '#/components/schemas/InUseExternalBackend'
        service_catalog_sources:
          type: array
          items:
            $ref: '#/components/schemas/InUseServiceCatalogSource'
    ErrorPayload:
      description: 'The payload used by the server to response to the client with an Error, those errors could be any of the ones listed [here](https://github.com/cycloidio/youdeploy-http-api/blob/develop/errors/code.go#L10), only the CODE of the error is the one that is guaranteed to not change between the same major version, the MESSAGE could change.

        '
      title: Error Payload
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetailsItem'
        request_id:
          type: string
    UpdateCredential:
      description: Represents the Credential
      title: Credential
      required:
      - name
      - canonical
      - type
      - raw
      - path
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[a-z0-9]([a-z0-9\-_]*[a-z0-9])?$
        description:
          type: string
        name:
          type: string
        owner:
          description: 'User canonical that owns this credential. When a user is the owner of a credential he has

            all the permissions on it.

            '
          type: string
        path:
          type: string
          pattern: '[a-zA-z0-9_\-./]'
        raw:
          $ref: '#/components/schemas/CredentialRaw'
        type:
          type: string
          enum:
          - ssh
          - aws
          - custom
          - azure
          - azure_storage
          - gcp
          - basic_auth
          - elasticsearch
          - vmware
    InUseServiceCatalogSource:
      description: Represents a Service catalog source that's using credential
      title: InUseServiceCatalogSource
      required:
      - name
      - canonical
      properties:
        canonical:
          type: string
          maxLength: 100
          minLength: 2
