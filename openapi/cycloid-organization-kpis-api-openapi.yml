openapi: 3.2.0
info:
  description: This is the Cycloid's API Reference. It provides descriptions, syntax, and usage examples for each of the actions and data types available within our console.
  title: Welcome! Organization KPIs API
  termsOfService: https://console.cycloid.io/terms
  contact:
    name: The Great Owl
    url: https://www.cycloid.io
    email: contact@cycloid.io
  license:
    name: Cycloid @copyrights
    url: https://cycloid.io
  version: '0'
servers:
- url: https://http-api.cycloid.io
security:
- api_key: []
- api_key_query: []
tags:
- description: Operations on KPIs of an organization
  name: Organization KPIs
paths:
  /organizations/{organization_canonical}/kpis:
    parameters:
    - $ref: '#/components/parameters/organization_canonical'
    - $ref: '#/components/parameters/timestamp_range_begin_query'
    - $ref: '#/components/parameters/timestamp_range_end_query'
    - $ref: '#/components/parameters/page_index'
    - $ref: '#/components/parameters/page_size'
    - $ref: '#/components/parameters/favorite'
    get:
      description: Get the list of configured KPIs in this organization
      tags:
      - Organization KPIs
      operationId: getOrganizationKpis
      responses:
        '200':
          description: The list of the KPIs in this organization
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
