naftiko: 1.0.0-alpha2
info:
  label: Cycloid HTTP API — ConfigRepositories
  description: 'Cycloid HTTP API — ConfigRepositories. 1 operations. Lead operation: List config repositories. Self-contained
    Naftiko capability covering one Cycloid business surface.'
  tags:
  - Cycloid
  - ConfigRepositories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CYCLOID_API_KEY: CYCLOID_API_KEY
capability:
  consumes:
  - type: http
    namespace: cycloid-configrepositories
    baseUri: https://http-api.cycloid.io
    description: Cycloid HTTP API — ConfigRepositories business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization_canonical-config_repositories
      path: /organizations/{organization_canonical}/config_repositories
      operations:
      - name: listconfigrepositories
        method: GET
        description: List config repositories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
