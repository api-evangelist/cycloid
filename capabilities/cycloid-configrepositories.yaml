      name: organizations-organization-canonical-config-repositories
      description: REST surface for organizations-organization_canonical-config_repositories.
      operations:
      - method: GET
        name: listconfigrepositories
        description: List config repositories
        call: cycloid-configrepositories.listconfigrepositories
        outputParameters:
        - type: object
          mapping: $.
