naftiko: 1.0.0-alpha2
info:
  label: Cycloid HTTP API — Credentials
  description: 'Cycloid HTTP API — Credentials. 2 operations. Lead operation: List credentials. Self-contained Naftiko capability
    covering one Cycloid business surface.'
  tags:
  - Cycloid
  - Credentials
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CYCLOID_API_KEY: CYCLOID_API_KEY
capability:
  consumes:
  - type: http
    namespace: cycloid-credentials
    baseUri: https://http-api.cycloid.io
    description: Cycloid HTTP API — Credentials business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization_canonical-credentials
      path: /organizations/{organization_canonical}/credentials
      operations:
      - name: listcredentials
        method: GET
        description: List credentials
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcredential
        method: POST
        description: Create credential
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CYCLOID_API_KEY}}'
  exposes:
  - type: rest
    namespace: cycloid-credentials-rest
    port: 8080
    description: REST adapter for Cycloid HTTP API — Credentials. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/organizations/{organization-canonical}/credentials
      name: organizations-organization-canonical-credentials
      description: REST surface for organizations-organization_canonical-credentials.
      operations:
      - method: GET
        name: listcredentials
        description: List credentials
        call: cycloid-credentials.listcredentials
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcredential
        description: Create credential
        call: cycloid-credentials.createcredential
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cycloid-credentials-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cycloid HTTP API — Credentials. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-credentials
      description: List credentials
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cycloid-credentials.listcredentials
      outputParameters:
      - type: object
        mapping: $.
    - name: create-credential
      description: Create credential
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cycloid-credentials.createcredential
      outputParameters:
      - type: object
        mapping: $.
